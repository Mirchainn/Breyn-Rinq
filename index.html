<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Ring - Studio Edition</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617 75%);
    color: white;
    text-align: center;
    min-height: 100vh;
    padding-bottom: 30px;
}

.box {
    padding: 15px;
    max-width: 550px;
    margin: auto;
}

/* Başlıqlar */
h1 {
    font-size: 45px;
    margin: 25px 0;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
    font-weight: 900;
}

h2 {
    font-size: 28px;
    margin: 20px 0;
}

h3 {
    font-size: 24px;
    color: #facc15;
}

/* Ümumi Düymələr */
button {
    width: 90%;
    max-width: 400px;
    padding: 18px;
    margin: 12px auto;
    border: none;
    border-radius: 20px;
    font-size: 22px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    display: block;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}

button:active {
    transform: scale(0.96);
}

.admin {
    background: linear-gradient(135deg, #22c55e, #15803d);
}

.team {
    background: linear-gradient(135deg, #2563eb, #1e40af);
}

.backBtn {
    background: linear-gradient(135deg, #64748b, #334155) !important;
}

/* Input və Select */
input, select {
    width: 90%;
    max-width: 380px;
    padding: 16px;
    margin: 10px auto;
    border: 2px solid #334155;
    border-radius: 16px;
    background: #0f172a;
    color: #fff;
    font-size: 18px;
    text-align: center;
    outline: none;
    display: block;
}

input:focus, select:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
}

.hidden {
    display: none;
}

/* Otaq Kodu Ekranı */
#roomDisplay {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.9);
    color: #facc15;
    font-size: 28px;
    margin: 15px 0;
    border: 1px solid #facc15;
    box-shadow: 0 0 20px rgba(250,204,21,0.3);
}

/* Status */
#teamStatus {
    font-size: 26px;
    margin: 20px 0;
    font-weight: bold;
    min-height: 40px;
}

/* BAS Düyməsi (Böyük Qırmızı/Yaşıl Studio düyməsi) */
#gamePage button.press-btn {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    font-size: 40px;
    background: radial-gradient(circle at 30% 25%, #f87171, #dc2626 50%, #7f1d1d);
    box-shadow: 0 0 50px rgba(239,68,68,0.7), inset 0 0 25px rgba(255,255,255,0.3);
    border: 5px solid #ef4444;
    margin: 20px auto;
}

#gamePage button.press-btn:disabled {
    background: radial-gradient(circle at 30% 25%, #64748b, #334155 50%, #0f172a);
    box-shadow: none;
    border-color: #475569;
    cursor: not-allowed;
}

/* Studio Məlumat Kartları */
.info-card {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #334155;
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 16px;
    margin: 15px auto;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Xallar Şəbəkəsi (Düzəldilmiş səliqəli dizayn) */
.score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 10px 0;
}

.score-card {
    background: rgba(30, 41, 59, 0.95);
    border-radius: 16px;
    padding: 12px 8px;
    border: 2px solid #475569;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.score-card.green { border-color: #22c55e; box-shadow: 0 0 15px rgba(34,197,94,0.15); }
.score-card.red { border-color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.15); }

.score-card h4 {
    margin: 0 0 5px 0;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #cbd5e1;
}

.score-card .score-num {
    font-size: 32px;
    font-weight: 900;
    margin: 5px 0;
    color: #f8fafc;
}

.score-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
}

.score-actions button {
    width: auto !important;
    padding: 8px 12px !important;
    margin: 0 !important;
    font-size: 16px !important;
    border-radius: 10px !important;
}

.score-footer {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
}

.reset-trash-btn {
    width: auto !important;
    padding: 14px 20px !important;
    margin: 0 !important;
    background: linear-gradient(135deg, #ef4444, #991b1b) !important;
    font-size: 20px !important;
    border-radius: 14px !important;
}

/* Yekun Qalib Pəncərəsi */
#winnerOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(30,41,59,0.95) 0%, rgba(2,6,23,0.98) 100%);
    z-index: 9999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.win-text {
    font-size: 50px;
    margin: 20px 0;
    color: #facc15;
    text-shadow: 0 0 35px rgba(250, 204, 21, 0.7);
    animation: pulse 1s infinite;
    line-height: 1.2;
}

.lose-text {
    font-size: 35px;
    margin: 20px 0;
    color: #94a3b8;
    line-height: 1.2;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="box">

<div id="main">
    <h1>🧠 Brain Ring</h1>
    <button class="admin" onclick="showAdmin()">👑 Aparıcı</button>
    <button class="team" onclick="showTeam()">👥 Komanda</button>
</div>

<div id="adminPage" class="hidden">
    <h2>👑 Admin / İzləyici</h2>
    <input id="password" type="password" placeholder="Şifrə">
    <div id="spectatorCodeBox" class="hidden">
        <input id="spectatorRoomCode" placeholder="Otaq Kodu">
    </div>
    <button class="admin" onclick="loginAdmin()">DAXİL OL</button>
    <button class="backBtn" onclick="goHome()">⬅️ Geri</button>
</div>

<div id="teamPage" class="hidden">
    <h2>👥 Komanda</h2>
    <input id="teamName" placeholder="Komanda adı">
    <input id="roomCode" placeholder="Otaq kodu">
    <select id="teamColor">
        <option value="green">🟢 Yaşıl masa</option>
        <option value="red">🔴 Qırmızı masa</option>
    </select>
    <button class="team" onclick="joinRoom()">QOŞUL</button>
    <button class="backBtn" onclick="goHome()">⬅️ Geri</button>
</div>

<div id="gamePage" class="hidden">
    <h2 id="myTeam"></h2>
    
    <div class="info-card">
        <div style="display:flex; justify-content:space-around; font-size:16px; font-weight:bold;">
            <div id="greenTeamPlayer">🟢 Yaşıl: -</div>
            <div id="redTeamPlayer">🔴 Qırmızı: -</div>
        </div>
        <hr style="border-color:#334155; margin:10px 0;">
        <div style="font-size:22px; font-weight:900;">
            🟢 <span id="greenScorePlayer">0</span> &nbsp;&nbsp;:&nbsp;&nbsp; <span id="redScorePlayer">0</span> 🔴
        </div>
    </div>

    <h1 id="playerTimer" style="font-size: 50px; color: #facc15; margin: 10px 0; font-weight: 900;">20</h1>
    <button id="pressButtonElem" class="team press-btn" onclick="pressButton()">🔴 BAS</button>
    <h2 id="teamStatus"></h2>
    
    <div id="winnerOverlay">
        <div id="winnerMessage"></div>
    </div>
</div>

<div id="adminPanel" class="hidden">
    <h2>👑 Admin Panel</h2>
    <button class="admin" onclick="createRoom()">OTAQ YARAT</button>
    <br>
    <div id="roomDisplay" class="hidden"></div>

    <div class="info-card">
        <div style="display:flex; justify-content:space-around; font-size:16px; font-weight:bold;">
            <div id="greenTeam">🟢 Yaşıl: -</div>
            <div id="redTeam">🔴 Qırmızı: -</div>
        </div>
    </div>

    <h2 id="winner" style="font-size: 26px; color: #38bdf8; margin: 15px 0;"></h2>

    <h1 id="adminTimer" style="font-size: 50px; color: #facc15; margin: 10px 0; font-weight: 900;">20</h1>
    
    <div style="display:flex; justify-content:center; gap:8px;">
        <button class="admin" style="width:48%; margin:5px 0;" onclick="startGame()">START</button>
        <button class="admin" style="width:48%; margin:5px 0; background:linear-gradient(135deg,#eab308,#ca8a04);" onclick="continueGame()">NEXT</button>
    </div>
    <div style="display:flex; justify-content:center; gap:8px;">
        <button class="admin" style="width:48%; margin:5px 0; background:linear-gradient(135deg,#ef4444,#b91c1c);" onclick="resetGame()">RESET</button>
        <button class="admin" style="width:48%; margin:5px 0; background:linear-gradient(135deg,#8b5cf6,#6d28d9);" onclick="showScores()">🏆 XALLAR</button>
    </div>
</div>

<div id="scorePage" class="hidden">
    <h2>🏆 Xalların İdarəsi</h2>

    <div class="info-card">
        <div class="score-grid">
            <div class="score-card green">
                <div>
                    <h4 id="scoreGreenName">🟢 Yaşıl Masa</h4>
                    <div class="score-num" id="greenScore">0</div>
                    <div class="score-actions">
                        <button class="team" onclick="changeScore('green',-1)">➖</button>
                        <button class="team" onclick="changeScore('green',1)">➕</button>
                    </div>
                </div>
                <button style="width:100%; margin:10px 0 0 0 !important; padding:10px !important; font-size:15px !important; background:linear-gradient(135deg,#eab308,#ca8a04); border-radius:10px; color:white; font-weight:bold; border:none; cursor:pointer;" onclick="declareWinner('green')">🏆 Qalib Et</button>
            </div>

            <div class="score-card red">
                <div>
                    <h4 id="scoreRedName">🔴 Qırmızı Masa</h4>
                    <div class="score-num" id="redScore">0</div>
                    <div class="score-actions">
                        <button class="admin" style="background:#dc2626;" onclick="changeScore('red',-1)">➖</button>
                        <button class="admin" style="background:#dc2626;" onclick="changeScore('red',1)">➕</button>
                    </div>
                </div>
                <button style="width:100%; margin:10px 0 0 0 !important; padding:10px !important; font-size:15px !important; background:linear-gradient(135deg,#eab308,#ca8a04); border-radius:10px; color:white; font-weight:bold; border:none; cursor:pointer;" onclick="declareWinner('red')">🏆 Qalib Et</button>
            </div>
        </div>

        <div class="score-footer">
            <button class="backBtn" onclick="backToAdmin()" style="width: 70% !important;">⬅️ Geri</button>
            <button class="reset-trash-btn" onclick="resetScores()" title="Xalları Sıfırla">🗑️</button>
        </div>
    </div>
</div>

</div>

<script>
let timerInterval = null;
let isSpectator = false;

function startLocalTimer(startTime, duration = 20) {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        let passed = Math.floor((Date.now() - startTime) / 1000);
        let rem = duration - passed;
        if (rem <= 0) {
            rem = 0;
            clearInterval(timerInterval);
        }
        let aTimer = document.getElementById("adminTimer");
        let pTimer = document.getElementById("playerTimer");
        if (aTimer) aTimer.innerHTML = rem;
        if (pTimer) pTimer.innerHTML = rem;
    }, 200);
}

function stopLocalTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function hideAll(){
    document.getElementById("main").style.display="none";
    document.getElementById("adminPage").style.display="none";
    document.getElementById("teamPage").style.display="none";
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("gamePage").style.display="none";
    document.getElementById("scorePage").style.display="none";
}

function showAdmin(){
    hideAll();
    isSpectator = false;
    document.getElementById("adminPage").style.display="block";
    document.getElementById("spectatorCodeBox").style.display="none";
    document.getElementById("password").value = "";
}

document.getElementById("password").addEventListener("input", function(){
    if(this.value.trim().toUpperCase() === "MRS"){
        document.getElementById("spectatorCodeBox").style.display="block";
        isSpectator = true;
    } else {
        document.getElementById("spectatorCodeBox").style.display="none";
        isSpectator = false;
    }
});

function showTeam(){
    hideAll();
    isSpectator = false;
    document.getElementById("teamPage").style.display="block";
}

function loginAdmin(){
    let pass = document.getElementById("password").value.trim();
    if(pass === "TMGRT"){
        hideAll();
        document.getElementById("adminPanel").style.display="block";
    } else if(pass.toUpperCase() === "MRS"){
        let code = document.getElementById("spectatorRoomCode").value.trim();
        if(code === ""){
            alert("Zəhmət olmasa izləniləcək otaq kodunu daxil edin!");
            return;
        }
        
        ['startSound', 'resetSound', 'failSound', 'pressSound'].forEach(id => {
            let s = document.getElementById(id);
            if(s) { s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {}); }
        });

        hideAll();
        document.getElementById("gamePage").style.display="block";
        document.getElementById("myTeam").innerHTML = "👀 İzləyici Rejimi";
        
        document.getElementById("pressButtonElem").style.display = "none";
        document.getElementById("teamStatus").innerHTML = "Canlı izlənilir...";
        
        startSpectatorMode(code);
    } else {
        alert("Səhv şifrə");
    }
}

function startSpectatorMode(code){
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,onValue})=>{
            
            onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                let teams = snapshot.val() || {};
                let green = "-";
                let red = "-";
                for(let team in teams){
                    if(teams[team].table==="green") green = team;
                    if(teams[team].table==="red") red = team;
                }
                let g2 = document.getElementById("greenTeamPlayer");
                let r2 = document.getElementById("redTeamPlayer");
                if(g2) g2.innerHTML = "🟢 " + green;
                if(r2) r2.innerHTML = "🔴 " + red;
            });

            onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                let gPlayer = document.getElementById("greenScorePlayer");
                let rPlayer = document.getElementById("redScorePlayer");
                if(gPlayer) gPlayer.innerHTML = scores.green;
                if(rPlayer) rPlayer.innerHTML = scores.red;
            });

            onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                let tData = snapshot.val();
                if (tData && tData.status === "started") {
                    startLocalTimer(tData.startTime, tData.duration || 20);
                } else {
                    stopLocalTimer();
                    if (tData && tData.duration !== undefined) {
                        let pTimer = document.getElementById("playerTimer");
                        if (pTimer) pTimer.innerHTML = tData.duration;
                    }
                }
            });

            onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                let data = snapshot.val();
                let status = document.getElementById("teamStatus");
                if(data){
                    stopLocalTimer();
                    if(data.valid===false){
                        status.innerHTML="❌ "+data.team+" FAIL START!";
                    } else if(data.valid===true){
                        status.innerHTML="🔴 "+data.team+" basdı!";
                    }
                } else {
                    status.innerHTML="Canlı izlənilir...";
                }
            });

            onValue(ref(db,"rooms/"+code+"/resetSignal"),(snapshot)=>{
                let signal = snapshot.val();
                if(!signal) return;
                let status = document.getElementById("teamStatus");
                if(signal.type === "reset" || signal.type === "next"){
                    if(status) status.innerHTML = "Canlı izlənilir...";
                }
            });

            onValue(ref(db, "rooms/" + code + "/sound"), (snapshot) => {
                let sound = snapshot.val();
                if (!sound) return;
                let sElem = document.getElementById(sound.type === "start" ? "startSound" : sound.type === "reset" ? "resetSound" : sound.type === "fail" ? "failSound" : "pressSound");
                if(sElem){
                    sElem.currentTime = 0;
                    sElem.play().catch(()=>{});
                }
            });
            
            onValue(ref(db,"rooms/"+code+"/globalWinner"),(snapshot)=>{
                let winnerColor = snapshot.val();
                let overlay = document.getElementById("winnerOverlay");
                let msg = document.getElementById("winnerMessage");
                if(winnerColor){
                    overlay.style.display = "flex";
                    msg.innerHTML = "🏆 OYUN BİTDİ 🏆<br><span style='font-size:26px'>" + (winnerColor === 'green' ? "🟢 Yaşıl Masa" : "🔴 Qırmızı Masa") + " qalib oldu!</span>";
                    msg.className = "win-text";
                } else {
                    overlay.style.display = "none";
                }
            });
        });
    });
}

function createRoom(){
    ['startSound', 'resetSound', 'failSound', 'pressSound'].forEach(id => {
        let s = document.getElementById(id);
        if(s) { s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {}); }
    });

    let code = Math.floor(1000 + Math.random()*9000);
    let rDisp = document.getElementById("roomDisplay");
    rDisp.style.display = "inline-block";
    rDisp.innerHTML = "🏠 Otaq kodu: " + code;
    listenPress(code);
    
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set})=>{
            set(ref(db, "rooms/" + code), {
                active: true,
                created: Date.now(),
                scores: { green: 0, red: 0 }
            });
        });
    });
}

function listenPress(code){
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,onValue})=>{
            
            onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                let data = snapshot.val();
                if(data){
                    stopLocalTimer();
                    if(data.valid === true){
                        document.getElementById("winner").innerHTML = "🔴 " + data.team + " BASDI!";
                    }else{
                        document.getElementById("winner").innerHTML = "⚠️ " + data.team + " FAIL";
                    }
                }
            });

            onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                let teams = snapshot.val() || {};
                let green = "-";
                let red = "-";

                for(let team in teams){
                    if(teams[team].table==="green") green = team;
                    if(teams[team].table==="red") red = team;
                }

                let g = document.getElementById("greenTeam");
                let r = document.getElementById("redTeam");
                if(g) g.innerHTML = "🟢 " + green;
                if(r) r.innerHTML = "🔴 " + red;

                let g2 = document.getElementById("greenTeamPlayer");
                let r2 = document.getElementById("redTeamPlayer");
                if(g2) g2.innerHTML = "🟢 " + green;
                if(r2) r2.innerHTML = "🔴 " + red;

                let sGreen = document.getElementById("scoreGreenName");
                let sRed = document.getElementById("scoreRedName");
                if(sGreen) sGreen.innerHTML = "🟢 " + green;
                if(sRed) sRed.innerHTML = "🔴 " + red;
            });

            onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                let gScore = document.getElementById("greenScore");
                let rScore = document.getElementById("redScore");
                if(gScore) gScore.innerHTML = scores.green;
                if(rScore) rScore.innerHTML = scores.red;
                
                let gPlayer = document.getElementById("greenScorePlayer");
                let rPlayer = document.getElementById("redScorePlayer");
                if(gPlayer) gPlayer.innerHTML = scores.green;
                if(rPlayer) rPlayer.innerHTML = scores.red;
            });

            onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                let tData = snapshot.val();
                if (tData && tData.status === "started") {
                    startLocalTimer(tData.startTime, tData.duration || 20);
                } else {
                    stopLocalTimer();
                    if (tData && tData.duration !== undefined) {
                        let aTimer = document.getElementById("adminTimer");
                        let pTimer = document.getElementById("playerTimer");
                        if (aTimer) aTimer.innerHTML = tData.duration;
                        if (pTimer) pTimer.innerHTML = tData.duration;
                    }
                }
            });

            onValue(ref(db, "rooms/" + code + "/sound"), (snapshot) => {
                let sound = snapshot.val();
                if (!sound) return;
                let sElem = document.getElementById(sound.type === "start" ? "startSound" : sound.type === "reset" ? "resetSound" : sound.type === "fail" ? "failSound" : "pressSound");
                if(sElem){
                    sElem.currentTime = 0;
                    sElem.play().catch(()=>{});
                }
            });
        });
    });
}

function joinRoom(){
    let name = document.getElementById("teamName").value;
    let code = document.getElementById("roomCode").value;
    let color = document.getElementById("teamColor").value;

    if(name==="" || code===""){
        alert("Ad və otaq kodunu yaz");
        return;
    }

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set,onValue})=>{
            get(ref(db,"rooms/"+code)).then((snapshot)=>{
                if(snapshot.exists()){
                    get(ref(db,"rooms/"+code+"/teams")).then((teamSnapshot)=>{
                        let teams = teamSnapshot.val() || {};
                        for(let team in teams){
                            if(teams[team].table === color){
                                alert("⚠️ Bu masa artıq tutulub!");
                                return;
                            }
                        }

                        document.getElementById("teamPage").style.display="none";
                        document.getElementById("gamePage").style.display="block";

                        document.getElementById("pressButtonElem").style.display = "inline-block";

                        set(ref(db,"rooms/"+code+"/teams/"+name),{ table:color });

                        document.getElementById("myTeam").innerHTML = (color==="green" ? "🟢 " : "🔴 ") + name;

                        let playButton = document.querySelector("#gamePage button.press-btn");
                        if(color==="green"){
                            playButton.style.background = "radial-gradient(circle at 30% 25%, #4ade80, #16a34a 50%, #14532d)";
                            playButton.style.boxShadow = "0 0 50px rgba(34,197,94,0.7), inset 0 0 25px rgba(255,255,255,0.3)";
                            playButton.style.borderColor = "#22c55e";
                        }

                        let status = document.getElementById("teamStatus");
                        
                        onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                            let teams = snapshot.val() || {};
                            let green = "-";
                            let red = "-";
                            for(let team in teams){
                                if(teams[team].table==="green") green = team;
                                if(teams[team].table==="red") red = team;
                            }
                            let g1 = document.getElementById("greenTeam");
                            let r1 = document.getElementById("redTeam");
                            if(g1) g1.innerHTML = "🟢 " + green;
                            if(r1) r1.innerHTML = "🔴 " + red;

                            let g2 = document.getElementById("greenTeamPlayer");
                            let r2 = document.getElementById("redTeamPlayer");
                            if(g2) g2.innerHTML = "🟢 " + green;
                            if(r2) r2.innerHTML = "🔴 " + red;
                        });

                        onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                            let scores = snapshot.val() || { green:0, red:0 };
                            let gPlayer = document.getElementById("greenScorePlayer");
                            let rPlayer = document.getElementById("redScorePlayer");
                            if(gPlayer) gPlayer.innerHTML = scores.green;
                            if(rPlayer) rPlayer.innerHTML = scores.red;
                        });

                        onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                            let tData = snapshot.val();
                            if (tData && tData.status === "started") {
                                startLocalTimer(tData.startTime, tData.duration || 20);
                            } else {
                                stopLocalTimer();
                                if (tData && tData.duration !== undefined) {
                                    let aTimer = document.getElementById("adminTimer");
                                    let pTimer = document.getElementById("playerTimer");
                                    if (aTimer) aTimer.innerHTML = tData.duration;
                                    if (pTimer) pTimer.innerHTML = tData.duration;
                                }
                            }
                        });

                        onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                            let data = snapshot.val();
                            let button = document.querySelector("#gamePage button.press-btn");
                            if(data){
                                stopLocalTimer();
                                if(button){
                                    button.disabled=true;
                                    button.innerHTML="🔒";
                                }
                                if(data.valid===false){
                                    if(data.team===name){
                                        status.innerHTML="❌ FAIL START";
                                    } else {
                                        status.innerHTML="❌ "+data.team+" FAIL!";
                                    }
                                } else if(data.valid===true){
                                    if(data.team===name){
                                        status.innerHTML="✅ Siz ilk basdınız!";
                                    } else {
                                        status.innerHTML="🔴 "+data.team+" basdı!";
                                    }
                                }
                            }
                        });

                        onValue(ref(db,"rooms/"+code+"/resetSignal"),(snapshot)=>{
                            let signal = snapshot.val();
                            if(!signal) return;
                            let button = document.querySelector("#gamePage button.press-btn");
                            if(button){
                                if(signal.type === "reset"){
                                    button.disabled = false;
                                    button.innerHTML = "🔴 BAS";
                                    if(status) status.innerHTML = "";
                                } else if(signal.type === "next"){
                                    if(signal.blockedTeam === name){
                                        button.disabled = true;
                                        button.innerHTML = "🔒";
                                        if(status) status.innerHTML = "⛔ Şansınızı itirdiniz!";
                                    } else {
                                        button.disabled = false;
                                        button.innerHTML = "🔴 BAS";
                                        if(status) status.innerHTML = "";
                                    }
                                }
                            }
                        });

                        onValue(ref(db, "rooms/" + code + "/sound"), (snapshot) => {
                            let sound = snapshot.val();
                            if (!sound) return;
                            let sElem = document.getElementById(sound.type === "start" ? "startSound" : sound.type === "reset" ? "resetSound" : sound.type === "fail" ? "failSound" : "pressSound");
                            if(sElem){
                                sElem.currentTime = 0;
                                sElem.play().catch(()=>{});
                            }
                        });
                        
                        onValue(ref(db,"rooms/"+code+"/globalWinner"),(snapshot)=>{
                            let winnerColor = snapshot.val();
                            let overlay = document.getElementById("winnerOverlay");
                            let msg = document.getElementById("winnerMessage");
                            
                            if(winnerColor){
                                overlay.style.display = "flex";
                                if(winnerColor === color){
                                    msg.innerHTML = "🏆 TƏBRİKLƏR! 🏆<br><span style='font-size:26px'>SİZ QALİB OLDUNUZ!</span>";
                                    msg.className = "win-text";
                                } else {
                                    msg.innerHTML = "❌ OYUN BİTDİ ❌<br><span style='font-size:26px'>Rəqib komanda qalib oldu.</span>";
                                    msg.className = "lose-text";
                                }
                            } else {
                                overlay.style.display = "none";
                            }
                        });
                    });
                } else {
                    alert("Belə otaq yoxdur");
                }
            });
        });
    });
}

function startGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            remove(ref(db, "rooms/" + code + "/pressed"));
            set(ref(db,"rooms/"+code+"/gameStarted"),true).then(()=>{
                set(ref(db, "rooms/" + code + "/timer"), { startTime: Date.now(), duration: 20, status: "started" });
                set(ref(db,"rooms/"+code+"/resetSignal"),{ type: "reset", time: Date.now() });
                set(ref(db,"rooms/"+code+"/sound"),{ type:"start", time:Date.now() });
            });
        });
    });
}

function continueGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set,remove})=>{
            get(ref(db, "rooms/" + code + "/pressed")).then((pSnap) => {
                let pressedData = pSnap.val();
                if(!pressedData || !pressedData.team) {
                    alert("NEXT yalnız birinci komanda düyməyə basdıqdan sonra işləyir!");
                    return;
                }
                if(pressedData.valid === false) {
                    alert("Fail Start olduqda NEXT işləmir! RESET verin.");
                    return;
                }

                get(ref(db, "rooms/" + code + "/timer")).then((tSnap) => {
                    let tData = tSnap.val() || { duration: 20 };
                    let rem = tData.duration !== undefined ? tData.duration : 20;

                    remove(ref(db, "rooms/" + code + "/pressed"));
                    set(ref(db, "rooms/" + code + "/resetSignal"), { type: "next", blockedTeam: pressedData.team, time: Date.now() });
                    set(ref(db, "rooms/" + code + "/gameStarted"), true);
                    set(ref(db, "rooms/" + code + "/timer"), { status: "started", startTime: Date.now(), duration: rem });
                    set(ref(db, "rooms/" + code + "/sound"), { type: "start", time: Date.now() });
                    
                    let winner = document.getElementById("winner");
                    if(winner) winner.innerHTML = "";
                });
            });
        });
    });
}

function resetGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            set(ref(db,"rooms/"+code+"/gameStarted"),false);
            remove(ref(db,"rooms/"+code+"/pressed"));
            set(ref(db, "rooms/" + code + "/timer"), { status: "stopped", duration: 20 });
            
            document.getElementById("adminTimer").innerHTML = "20";
            let pT = document.getElementById("playerTimer");
            if (pT) pT.innerHTML = "20";

            set(ref(db,"rooms/"+code+"/resetSignal"),{ type: "reset", time: Date.now() });
            set(ref(db,"rooms/"+code+"/sound"),{ type:"reset", time:Date.now() });

            let winner = document.getElementById("winner");
            if(winner) winner.innerHTML="";
        });
    });
}

function pressButton(){
    if(isSpectator) return;
    let name = document.getElementById("teamName").value;
    let code = document.getElementById("roomCode").value;

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,runTransaction,set,update})=>{
            get(ref(db,"rooms/"+code+"/gameStarted")).then((snapshot)=>{
                let started = snapshot.val() === true;

                runTransaction(ref(db,"rooms/"+code+"/pressed"),(current)=>{
                    if(current !== null) return current;
                    return { team:name, valid:started, time:Date.now() };
                }).then((result)=>{
                    if(result.committed){
                        get(ref(db, "rooms/" + code + "/timer")).then((tSnap) => {
                            let tData = tSnap.val() || { startTime: Date.now(), duration: 20 };
                            let rem = tData.duration || 20;
                            if(started && tData.startTime){
                                let passed = Math.floor((Date.now() - tData.startTime) / 1000);
                                rem = rem - passed;
                            }
                            if (rem < 0) rem = 0;
                            
                            update(ref(db, "rooms/" + code + "/timer"), { status: "stopped", duration: rem });
                        });

                        if(started){
                            document.getElementById("teamStatus").innerHTML = "✅ Siz ilk basdınız!";
                            set(ref(db,"rooms/"+code+"/sound"),{ type:"press", time:Date.now() });
                        } else {
                            document.getElementById("teamStatus").innerHTML = "❌ FAIL START";
                            set(ref(db,"rooms/"+code+"/sound"),{ type:"fail", time:Date.now() });
                        }
                    } else {
                        document.getElementById("teamStatus").innerHTML = "⛔ Başqa komanda cavab verdi.";
                    }
                });
            });
        });
    });
}

function changeScore(color, amount){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set})=>{
            get(ref(db,"rooms/"+code+"/scores")).then((snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                scores[color] += amount;
                if(scores[color] < 0) scores[color] = 0;
                if(scores.green > 5) scores.green = 5;
                if(scores.red > 5) scores.red = 5;
                set(ref(db,"rooms/"+code+"/scores"),scores);
            });
        });
    });
}

function declareWinner(color){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!confirm("Əminsiniz? Bu komanda yekun qalib elan olunacaq!")) return;
    
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set})=>{
            set(ref(db,"rooms/"+code+"/globalWinner"), color);
            alert("Qalib elan edildi!");
        });
    });
}

function resetScores(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!confirm("Xalları sıfırlamaq istəyirsiniz?")) return;

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            set(ref(db,"rooms/"+code+"/scores"),{ green:0, red:0 });
            remove(ref(db,"rooms/"+code+"/globalWinner"));
        });
    });
}

function showScores(){
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("scorePage").style.display="block";
}

function backToAdmin(){
    document.getElementById("scorePage").style.display="none";
    document.getElementById("adminPanel").style.display="block";
}

function goHome(){
    hideAll();
    document.getElementById("main").style.display="block";
}

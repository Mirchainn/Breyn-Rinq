
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brain Ring</title>

<style>
/* --- MODERN VƏ PREMIUM BRAIN RING STİLLƏRİ --- */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at top, #1e1b4b, #030712 80%);
    color: #f8fafc;
    text-align: center;
    min-height: 100vh;
    padding-top: 40px; /* Elementlərin yuxarıdan zərif məsafədə başlaması üçün */
    overflow-x: hidden;
}

.box {
    padding: 30px;
    width: 90%;
    max-width: 500px;
    margin: 0 auto; /* Qutunun ekranda tam ortalanması üçün */
    background: rgba(30, 41, 59, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.6s ease-out;
}


/* Başlıqlar */
h1 {
    font-size: 48px;
    font-weight: 900;
    margin: 20px 0 35px 0;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
    filter: drop-shadow(0 2px 8px rgba(129, 140, 248, 0.3));
}

h2 {
    font-size: 26px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 25px;
}

h3 {
    font-size: 20px;
    font-weight: 600;
    color: #94a3b8;
    margin: 15px 0 5px 0;
}

/* Müasir Giriş Sahələri (Inputs) */
input, select {
    width: 85%;
    max-width: 380px;
    padding: 16px 20px;
    margin: 10px 0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    background: rgba(15, 23, 42, 0.6);
    color: #ffffff;
    font-size: 18px;
    text-align: center;
    outline: none;
    transition: all 0.3s ease;
}

input:focus, select:focus {
    border-color: #6366f1;
    background: rgba(15, 23, 42, 0.9);
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
}

select option {
    background: #0f172a;
    color: white;
}

/* Ümumi Düymə Strukturu */
button {
    width: 90%;
    max-width: 420px;
    padding: 18px;
    margin: 12px auto;
    border: none;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: block;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

button:active {
    transform: translateY(1px) scale(0.98);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
    filter: grayscale(1);
}

/* Düymə Rəng Gradientləri */
.admin {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
}

.team {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
}

.soundBtn, .backBtn {
    background: linear-gradient(135deg, #475569, #334155) !important;
    box-shadow: 0 8px 20px rgba(51, 65, 85, 0.25);
}

/* Otaq Kodu */
#roomDisplay {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 16px;
    background: #0f172a;
    border: 1px solid rgba(250, 204, 21, 0.3);
    color: #facc15;
    font-size: 28px;
    font-weight: 800;
    margin: 15px auto;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.15);
}

/* Qalib və Status Yazıları */
#winner {
    font-size: 28px;
    font-weight: 800;
    color: #38bdf8;
    margin: 20px;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    animation: pulse 1.5s infinite;
}

#teamStatus {
    font-size: 22px;
    margin: 20px;
    font-weight: 700;
    color: #cbd5e1;
}

/* Böyük BAS Düyməsi (Yeniləndi) */
#gamePage button {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    font-size: 38px;
    font-weight: 900;
    margin: 30px auto;
    background: radial-gradient(circle at 30% 25%, #f87171, #ef4444 60%, #991b1b);
    box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4), inset 0 4px 10px rgba(255,255,255,0.3);
    border: 4px solid rgba(255, 255, 255, 0.1);
}

#gamePage button:active {
    transform: scale(0.94);
    box-shadow: 0 5px 15px rgba(239, 68, 68, 0.2);
}

/* Xal İdarəetmə Cədvəli Kartları */
#scorePage h2 {
    font-size: 36px;
    color: #ffffff;
}

#scorePage button {
    width: 60px;
    display: inline-block;
    margin: 5px;
    padding: 12px;
    font-size: 18px;
    border-radius: 12px;
}

#greenScore, #redScore {
    font-size: 64px;
    font-weight: 900;
    margin: 10px 0;
    text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}

#greenScore { color: #4ade80; }
#redScore { color: #f87171; }

/* Gizli animasiyalar */
.hidden { display: none !important; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); filter: brightness(1.1); }
    100% { transform: scale(1); }
}

/* Xal dəyişəndə işləyəcək animasiya (Bayaq istədiyiniz) */
.score-pop {
    animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
}

@keyframes popUp {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); filter: drop-shadow(0 0 15px currentColor); }
    100% { transform: scale(1); }
}

/* İncə xətt (HR) */
hr {
    border: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    margin: 20px 0;
}



</style>
</head>


<body>

<div class="box">


<div id="main">

<h1>🧠 Brain Ring</h1>

<button class="admin" onclick="showAdmin()">
👑 Aparıcı
</button>

<br>

<button class="team" onclick="showTeam()">
👥 Komanda
</button>

</div>



<div id="adminPage" class="hidden">

<h2>👑 Admin giriş</h2>

<input id="password" type="password" placeholder="Şifrə">

<br>

<button class="admin" onclick="loginAdmin()">
DAXİL OL
</button>
<button class="backBtn" onclick="goHome()">
⬅️ Geri
</button>

</div>




<div id="teamPage" class="hidden">

<h2>👥 Komanda</h2>

<input id="teamName" placeholder="Komanda adı">

<br>

<input id="roomCode" placeholder="Otaq kodu">

<br>

<select id="teamColor" style="
width:80%;
max-width:380px;
padding:18px;
margin:12px;
border:none;
border-radius:18px;
font-size:20px;
text-align:center;">

<option value="green">🟢 Yaşıl masa</option>
<option value="red">🔴 Qırmızı masa</option>

</select>

<br>

<button class="soundBtn" onclick="unlockSound()">
🔊 SƏSİ YOXLA
</button>

<button class="team" onclick="joinRoom()">
QOŞUL
</button>
<button class="backBtn" onclick="goHome()">
⬅️ Geri
</button>

</div>
<div id="gamePage" class="hidden">

<h2 id="myTeam"></h2>
<div id="teamsTablePlayer" style="
margin:12px auto;
max-width:320px;
background:#0f172a;
border-radius:12px;
padding:10px;
font-size:18px;
font-weight:bold;
line-height:1.6;
box-shadow:0 0 15px rgba(255,255,255,.08);
">

<div id="greenTeamPlayer">
🟢 Yaşıl: -
</div>

<div id="redTeamPlayer">
🔴 Qırmızı: -
</div>

</div>
<div id="scoreBoardPlayer" style="
margin:15px auto;
max-width:300px;
background:#0f172a;
border-radius:12px;
padding:12px;
font-size:22px;
font-weight:bold;
box-shadow:0 0 15px rgba(255,255,255,.08);
">

🟢 <span id="greenScorePlayer">0</span>

&nbsp;&nbsp;:

&nbsp;&nbsp;

<span id="redScorePlayer">0</span> 🔴

</div>
<button class="team" onclick="pressButton()" style="height:200px;font-size:40px;">
🔴 BAS
</button>
<h2 id="teamStatus"></h2>
</div>


<div id="adminPanel" class="hidden">

<h2>👑 Admin panel</h2>

<button class="admin" onclick="createRoom()">
OTAQ YARAT
</button>

<h3 id="roomDisplay"></h3>
<div id="teamsTable" style="
margin:12px auto;
max-width:320px;
background:#0f172a;
border-radius:12px;
padding:10px;
font-size:18px;
font-weight:bold;
line-height:1.6;
box-shadow:0 0 15px rgba(255,255,255,.08);
">

<div id="greenTeam">
🟢 Yaşıl: -
</div>

<div id="redTeam">
🔴 Qırmızı: -
</div>

</div>
<h2 id="winner"></h2>
<br>

<button class="admin" onclick="startGame()">
START
</button>
<h2 id="winner"></h2>
<button class="admin" onclick="resetGame()">
RESET
</button>
<button class="admin" onclick="showScores()">
🏆 XALLAR
</button>
</div>
<div id="scorePage" class="hidden">

<h2>🏆 Xallar</h2>

<div style="
margin:20px auto;
max-width:350px;
background:#0f172a;
padding:20px;
border-radius:15px;">

<h3>🟢 Yaşıl Komanda</h3>

<h2 id="greenScore">0</h2>

<button class="team" onclick="changeScore('green',-1)">➖</button>

<button class="team" onclick="changeScore('green',1)">➕</button>

<hr style="margin:25px 0;">

<h3>🔴 Qırmızı Komanda</h3>

<h2 id="redScore">0</h2>

<button class="admin" onclick="changeScore('red',-1)">➖</button>

<button class="admin" onclick="changeScore('red',1)">➕</button>

<br><br>

<button class="admin" onclick="resetScores()">
🗑️ XALLARI SIFIRLA
</button>

<br>

<button class="backBtn" onclick="backToAdmin()">
⬅️ Geri
</button>

</div>

</div>
<div id="status"></div>


</div>



<script>


function hideAll(){

document.getElementById("main").style.display="none";
document.getElementById("adminPage").style.display="none";
document.getElementById("teamPage").style.display="none";
document.getElementById("adminPanel").style.display="none";

}



function showAdmin(){

hideAll();

document.getElementById("adminPage").style.display="block";

}



function showTeam(){

hideAll();

document.getElementById("teamPage").style.display="block";

}



function loginAdmin(){

let pass=document.getElementById("password").value;


if(pass==="TMGRT"){

hideAll();

document.getElementById("adminPanel").style.display="block";

}

else{

alert("Səhv şifrə");

}

}
function createRoom(){

let code = Math.floor(1000 + Math.random()*9000);

document.getElementById("roomDisplay").innerHTML =
"🏠 Otaq kodu: " + code;
listenPress(code);
import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set})=>{

set(ref(db, "rooms/" + code), {
active: true,
created: Date.now(),

scores: {
green: 0,
red: 0
}
});

});

});

}
function listenPress(code){

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,onValue})=>{

onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{

let data = snapshot.val();

if(data){

if(data.valid === true){

document.getElementById("winner").innerHTML =
"🔴 " + data.team + " BASDI!";

}else{

document.getElementById("winner").innerHTML =
"⚠️ " + data.team + " FAIL";

}

}

});
onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{

let teams = snapshot.val() || {};

let green = "-";
let red = "-";

for(let team in teams){

if(teams[team].table==="green") green = team;

if(teams[team].table==="red") red = team;

}

let g = document.getElementById("greenTeam");
let r = document.getElementById("redTeam");

if(g) g.innerHTML = "🟢 Yaşıl: " + green;
if(r) r.innerHTML = "🔴 Qırmızı: " + red;

});
onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{

let scores = snapshot.val() || {
green:0,
red:0
};

let gScore = document.getElementById("greenScore");
let rScore = document.getElementById("redScore");

if(gScore) gScore.innerHTML = scores.green;
if(rScore) rScore.innerHTML = scores.red;
let gPlayer = document.getElementById("greenScorePlayer");
let rPlayer = document.getElementById("redScorePlayer");

if(gPlayer) gPlayer.innerHTML = scores.green;
if(rPlayer) rPlayer.innerHTML = scores.red;
});

});

});

}
function joinRoom(){

let name = document.getElementById("teamName").value;
let code = document.getElementById("roomCode").value;
let color = document.getElementById("teamColor").value;

if(name==="" || code===""){
alert("Ad və otaq kodunu yaz");
return;
}

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get,set,onValue})=>{

get(ref(db,"rooms/"+code))
.then((snapshot)=>{

if(snapshot.exists()){

get(ref(db,"rooms/"+code+"/teams"))
.then((teamSnapshot)=>{

let teams = teamSnapshot.val() || {};

for(let team in teams){

if(teams[team].table === color){

alert("⚠️ Bu masa artıq tutulub!");
return;

}

}

// masa boşdur, davam edir

document.getElementById("teamPage").style.display="none";

document.getElementById("gamePage").style.display="block";

set(ref(db,"rooms/"+code+"/teams/"+name),{
table:color
});

document.getElementById("myTeam").innerHTML =
(color==="green" ? "🟢 " : "🔴 ") + name;

let playButton = document.querySelector("#gamePage button");

if(color==="green"){

playButton.style.background =
"radial-gradient(circle at 30% 25%, #4ade80, #16a34a 50%, #14532d)";

playButton.style.boxShadow =
"0 0 40px rgba(34,197,94,.7), inset 0 0 25px rgba(255,255,255,.25)";

}

let status = document.getElementById("teamStatus");
onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{

let teams = snapshot.val() || {};

let green = "-";
let red = "-";

for(let team in teams){

if(teams[team].table==="green") green = team;

if(teams[team].table==="red") red = team;

}

let g1 = document.getElementById("greenTeam");
let r1 = document.getElementById("redTeam");

if(g1) g1.innerHTML = "🟢 Yaşıl: " + green;
if(r1) r1.innerHTML = "🔴 Qırmızı: " + red;

let g2 = document.getElementById("greenTeamPlayer");
let r2 = document.getElementById("redTeamPlayer");

if(g2) g2.innerHTML = "🟢 Yaşıl: " + green;
if(r2) r2.innerHTML = "🔴 Qırmızı: " + red;

});
// İŞTİRAKÇI EKRANINDA CANLI XALLARI GÖSTƏRMƏK ÜÇÜN ƏLAVƏ (YENİ)
onValue(ref(db, "rooms/" + code + "/scores"), (snapshot) => {
    let scores = snapshot.val() || { green: 0, red: 0 };
    
    // İştirakçı ekranındakı yaşıl və qırmızı xal elementlərini tapırıq
    let gPlayer = document.getElementById("greenScorePlayer");
    let rPlayer = document.getElementById("redScorePlayer");
    
    // Əgər elementlər ekranda varsa, içindəki rəqəmləri canlı olaraq yeniləyirik
    if(gPlayer) gPlayer.innerHTML = scores.green;
    if(rPlayer) rPlayer.innerHTML = scores.red;
});


// BAS NƏTİCƏSİ

onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{

let data = snapshot.val();

let button = document.querySelector("#gamePage button");

if(data){

if(button){

button.disabled=true;
button.innerHTML="🔒";

}

if(data.valid===false){

if(data.team===name){

status.innerHTML="❌ FAIL START";

}
else{

status.innerHTML=
"❌ "+data.team+" FAIL START etdi!";

}

}

else if(data.valid===true){

if(data.team===name){

status.innerHTML="✅ Siz ilk basdınız!";

}
else{

status.innerHTML=
"🔴 "+data.team+" artıq basdı!";

}

}
}

});

// RESET

onValue(ref(db,"rooms/"+code+"/resetSignal"),()=>{

let button = document.querySelector("#gamePage button");

if(button){

button.disabled=false;
button.innerHTML="🔴 BAS";

}

if(status){

status.innerHTML="";

}

});

// SƏS

let startSound=document.getElementById("startSound");
let resetSound=document.getElementById("resetSound");
let failSound=document.getElementById("failSound");
let pressSound=document.getElementById("pressSound");

onValue(ref(db,"rooms/"+code+"/sound"),(snapshot)=>{

let sound=snapshot.val();

if(sound.type==="start" && startSound){

startSound.currentTime=0;

startSound.play().catch(()=>{});

}

if(sound.type==="reset" && resetSound){

resetSound.currentTime=0;

resetSound.play().catch(()=>{});

}
if(sound.type==="fail" && failSound){

failSound.currentTime=0;

failSound.play().catch((e)=>{

console.log("Fail səs xətası:",e);

});

}


if(sound.type==="press" && pressSound){

pressSound.currentTime=0;

pressSound.play().catch((e)=>{

console.log("Press səs xətası:",e);

});

}


if(sound==="press" && pressSound){

pressSound.currentTime=0;

pressSound.play().catch(()=>{});

}
});

});

}

else{

alert("Belə otaq yoxdur");

}

});

});

});

}
function startGame(){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();


import("./firebase.js").then((module)=>{

let db = module.db;


import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set})=>{


set(ref(db,"rooms/"+code+"/gameStarted"),true)
.then(()=>{


console.log("START göndərildi");


// iştirakçılar üçün səs siqnalı

set(ref(db,"rooms/"+code+"/sound"),{
    type:"start",
    time:Date.now()
});


// admin üçün səs

let startSound = document.getElementById("startSound");

if(startSound){

startSound.currentTime = 0;

startSound.play()
.catch(()=>{});

}


});


});


});


}
function resetGame(){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();


import("./firebase.js").then((module)=>{

let db = module.db;


import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set,remove})=>{


// oyunu bağla

set(ref(db,"rooms/"+code+"/gameStarted"),false);


// əvvəlki basışı sil

remove(ref(db,"rooms/"+code+"/pressed"));


// iştirakçılara reset göndər

set(ref(db,"rooms/"+code+"/resetSignal"),Date.now());


// gong siqnalı

set(ref(db,"rooms/"+code+"/sound"),{
    type:"reset",
    time:Date.now()
});


// admin gong

let resetSound = document.getElementById("resetSound");

if(resetSound){

resetSound.currentTime = 0;

resetSound.play()
.catch(()=>{});

}



// admin qalib yazısını təmizlə

let winner = document.getElementById("winner");

if(winner){

winner.innerHTML="";

}


console.log("RESET göndərildi");


});


});


}
function pressButton(){

let name = document.getElementById("teamName").value;
let code = document.getElementById("roomCode").value;

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get,runTransaction,set})=>{

get(ref(db,"rooms/"+code+"/gameStarted"))
.then((snapshot)=>{

let started = snapshot.val() === true;

runTransaction(ref(db,"rooms/"+code+"/pressed"),(current)=>{

if(current !== null){
    return current;
}

return{

team:name,
valid:started,
time:Date.now()

};

}).then((result)=>{

if(result.committed){

if(started){

document.getElementById("teamStatus").innerHTML =
"✅ Siz ilk basdınız!";

set(ref(db,"rooms/"+code+"/sound"),{
    type:"press",
    time:Date.now()
});

}
else{

document.getElementById("teamStatus").innerHTML =
"❌ FAIL START";

set(ref(db,"rooms/"+code+"/sound"),{
    type:"fail",
    time:Date.now()
});

}

}
else{

document.getElementById("teamStatus").innerHTML =
"⛔ Başqa komanda cavab verdi.";

}

});

});

});

});

}
function unlockSound(){

let sound = document.getElementById("startSound");

if(sound){

sound.currentTime = 0;

sound.play()
.then(()=>{

sound.pause();

sound.currentTime = 0;

alert("Səs aktiv edildi ✅");

})
.catch((error)=>{

console.log("Səs xətası:", error);

alert("Səs aktiv olmadı ❌");

});

}

}
function changeScore(color, amount){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get,set})=>{

get(ref(db,"rooms/"+code+"/scores"))
.then((snapshot)=>{

let scores = snapshot.val() || {
green:0,
red:0
};

scores[color] += amount;

if(scores[color] < 0){
scores[color] = 0;
}

if(scores.green > 5) scores.green = 5;
if(scores.red > 5) scores.red = 5;

set(ref(db,"rooms/"+code+"/scores"),scores);

});

});

});

}

function resetScores(){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();

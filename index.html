<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Ring - Elite Studio</title>
<style>
:root {
    --bg-deep: #050508;
    --surface: rgba(18, 18, 26, 0.7);
    --border-glass: rgba(255, 255, 255, 0.08);
    --accent-silver: #94a3b8;
    --text-main: #f1f5f9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-deep);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.5) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
    color: var(--text-main);
    text-align: center;
    min-height: 100vh;
    padding-bottom: 40px;
}

.box {
    padding: 20px;
    max-width: 480px;
    margin: auto;
}

/* Premium Başlıqlar */
h1 {
    font-size: 36px;
    margin: 25px 0;
    color: #ffffff;
    letter-spacing: 4px;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 0 2px 20px rgba(255, 255, 255, 0.15);
}

h2 {
    font-size: 22px;
    margin: 15px 0;
    color: #cbd5e1;
    letter-spacing: 1px;
    font-weight: 600;
}

/* Elite Glass Düymələr */
button {
    width: 90%;
    max-width: 360px;
    padding: 15px 20px;
    margin: 10px auto;
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    display: block;
    letter-spacing: 1px;
}

button:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
}

button:active {
    transform: scale(0.98);
}

.admin {
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
    border-color: rgba(148, 163, 184, 0.2);
}

.team {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(3, 7, 18, 0.95));
}

.backBtn {
    background: rgba(30, 41, 59, 0.5) !important;
    color: #94a3b8 !important;
}

/* Input və Select - Premium Dark */
input, select {
    width: 90%;
    max-width: 360px;
    padding: 14px 16px;
    margin: 10px auto;
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    background: rgba(10, 10, 15, 0.8);
    color: #fff;
    font-size: 16px;
    text-align: center;
    outline: none;
    display: block;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

input:focus, select:focus {
    border-color: #64748b;
    box-shadow: 0 0 15px rgba(100, 116, 139, 0.2);
}

.hidden {
    display: none;
}

/* Otaq Kodu Ekranı */
#roomDisplay {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.9);
    color: #e2e8f0;
    font-size: 20px;
    margin: 15px 0;
    border: 1px solid rgba(255, 255, 255, 0.15);
    letter-spacing: 2px;
    font-weight: 600;
}

#teamStatus {
    font-size: 20px;
    margin: 15px 0;
    font-weight: 600;
    min-height: 30px;
    letter-spacing: 0.5px;
}

/* Oyunçunun Əsas BAS Düyməsi (Elite Studio Buzzer) */
#gamePage button.press-btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    background: radial-gradient(circle at 35% 30%, #ef4444, #991b1b 70%, #450a0a);
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.2);
    margin: 25px auto;
}

#gamePage button.press-btn.green-buzzer {
    background: radial-gradient(circle at 35% 30%, #22c55e, #15803d 70%, #052e16);
    box-shadow: 0 0 40px rgba(34, 197, 94, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.2);
}

#gamePage button.press-btn:disabled {
    background: radial-gradient(circle at 35% 30%, #1e293b, #0f172a 70%, #020617);
    box-shadow: none;
    border-color: rgba(255, 255, 255, 0.05);
    color: #475569;
    cursor: not-allowed;
}

/* Glassmorphism Kartları */
.info-card {
    background: var(--surface);
    border: 1px solid var(--border-glass);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 15px;
    margin: 15px auto;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
}

/* Xallar Şəbəkəsi */
.score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 10px 0;
}

.score-card {
    background: rgba(15, 23, 42, 0.6);
    border-radius: 12px;
    padding: 12px 8px;
    border: 1px solid var(--border-glass);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.score-card h4 {
    margin: 0 0 5px 0;
    font-size: 13px;
    color: #94a3b8;
    font-weight: 600;
}

.score-card .score-num {
    font-size: 32px;
    font-weight: 800;
    margin: 5px 0;
    color: #f8fafc;
}

.score-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
}

.score-actions button {
    width: auto !important;
    padding: 6px 10px !important;
    margin: 0 !important;
    font-size: 14px !important;
    border-radius: 8px !important;
}

.score-footer {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-top: 15px;
}

.reset-trash-btn {
    width: auto !important;
    padding: 12px 16px !important;
    margin: 0 !important;
    background: rgba(153, 27, 27, 0.4) !important;
    border-color: rgba(239, 68, 68, 0.3) !important;
    border-radius: 10px !important;
}

/* Yekun Qalib Pəncərəsi */
#winnerOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 5, 8, 0.95);
    z-index: 9999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(10px);
}

.win-text {
    font-size: 38px;
    margin: 20px 0;
    color: #e2e8f0;
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1.3;
}

.lose-text {
    font-size: 26px;
    margin: 20px 0;
    color: #64748b;
    font-weight: 600;
    line-height: 1.3;
}
</style>
</head>

<body>

<div class="box">

<div id="main">
    <h1>BRAIN RING</h1>
    <button class="admin" onclick="showAdmin()">Aparıcı Panel</button>
    <button class="team" onclick="showTeam()">Komanda Girişi</button>
</div>

<div id="adminPage" class="hidden">
    <h2>Aparıcı / İzləyici</h2>
    <input id="password" type="password" placeholder="Şifrə">
    <div id="spectatorCodeBox" class="hidden">
        <input id="spectatorRoomCode" placeholder="Otaq Kodu">
    </div>
    <button class="admin" onclick="loginAdmin()">DAXİL OL</button>
    <button class="backBtn" onclick="goHome()">Geri</button>
</div>

<div id="teamPage" class="hidden">
    <h2>Komanda Qeydiyyatı</h2>
    <input id="teamName" placeholder="Komanda adı">
    <input id="roomCode" placeholder="Otaq kodu">
    <select id="teamColor">
        <option value="green">Yaşıl Masa</option>
        <option value="red">Qırmızı Masa</option>
    </select>
    <button class="team" onclick="joinRoom()">QOŞUL</button>
    <button class="backBtn" onclick="goHome()">Geri</button>
</div>

<div id="gamePage" class="hidden">
    <h2 id="myTeam"></h2>
    
    <div class="info-card">
        <div style="display:flex; justify-content:space-around; font-size:14px; font-weight:600; color:#94a3b8;">
            <div id="greenTeamPlayer">Yaşıl: -</div>
            <div id="redTeamPlayer">Qırmızı: -</div>
        </div>
        <hr style="border-color:var(--border-glass); margin:10px 0;">
        <div style="font-size:20px; font-weight:800; letter-spacing: 1px;">
            <span id="greenScorePlayer">0</span> &nbsp;:&nbsp; <span id="redScorePlayer">0</span>
        </div>
    </div>

    <h1 id="playerTimer" style="font-size: 48px; color: #f8fafc; margin: 10px 0; font-weight: 800;">20</h1>
    <button id="pressButtonElem" class="team press-btn" onclick="pressButton()">BAS</button>
    <h2 id="teamStatus"></h2>
    
    <div id="winnerOverlay">
        <div id="winnerMessage"></div>
    </div>
</div>

<div id="adminPanel" class="hidden">
    <h2>Aparıcı İdarəetməsi</h2>
    <button class="admin" onclick="createRoom()">OTAQ YARAT</button>
    <br>
    <div id="roomDisplay" class="hidden"></div>

    <div class="info-card">
        <div style="display:flex; justify-content:space-around; font-size:14px; font-weight:600; color:#94a3b8;">
            <div id="greenTeam">Yaşıl: -</div>
            <div id="redTeam">Qırmızı: -</div>
        </div>
    </div>

    <h2 id="winner" style="font-size: 20px; color: #e2e8f0; margin: 15px 0; font-weight: 700;"></h2>

    <h1 id="adminTimer" style="font-size: 48px; color: #f8fafc; margin: 10px 0; font-weight: 800;">20</h1>
    
    <div style="display:flex; justify-content:center; gap:8px;">
        <button class="admin" style="width:48%; margin:5px 0;" onclick="startGame()">START</button>
        <button class="admin" style="width:48%; margin:5px 0;" onclick="continueGame()">NEXT</button>
    </div>
    <div style="display:flex; justify-content:center; gap:8px;">
        <button class="admin" style="width:48%; margin:5px 0; background:rgba(153, 27, 27, 0.3); border-color:rgba(239, 68, 68, 0.2);" onclick="resetGame()">RESET</button>
        <button class="admin" style="width:48%; margin:5px 0;" onclick="showScores()">XALLAR</button>
    </div>
</div>

<div id="scorePage" class="hidden">
    <h2>Xalların İdarəsi</h2>

    <div class="info-card">
        <div class="score-grid">
            <div class="score-card">
                <div>
                    <h4 id="scoreGreenName">Yaşıl Masa</h4>
                    <div class="score-num" id="greenScore">0</div>
                    <div class="score-actions">
                        <button class="admin" onclick="changeScore('green',-1)">-</button>
                        <button class="admin" onclick="changeScore('green',1)">+</button>
                    </div>
                </div>
                <button style="width:100%; margin:10px 0 0 0 !important; padding:8px !important; font-size:12px !important; background:rgba(30, 41, 59, 0.8);" onclick="declareWinner('green')">Qalib Et</button>
            </div>

            <div class="score-card">
                <div>
                    <h4 id="scoreRedName">Qırmızı Masa</h4>
                    <div class="score-num" id="redScore">0</div>
                    <div class="score-actions">
                        <button class="admin" onclick="changeScore('red',-1)">-</button>
                        <button class="admin" onclick="changeScore('red',1)">+</button>
                    </div>
                </div>
                <button style="width:100%; margin:10px 0 0 0 !important; padding:8px !important; font-size:12px !important; background:rgba(30, 41, 59, 0.8);" onclick="declareWinner('red')">Qalib Et</button>
            </div>
        </div>

        <div class="score-footer">
            <button class="backBtn" onclick="backToAdmin()" style="width: 70% !important;">Geri</button>
            <button class="reset-trash-btn" onclick="resetScores()" title="Xalları Sıfırla">🗑️</button>
        </div>
    </div>
</div>

</div>

<script>
let timerInterval = null;
let isSpectator = false;

function startLocalTimer(startTime, duration = 20) {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        let passed = Math.floor((Date.now() - startTime) / 1000);
        let rem = duration - passed;
        if (rem <= 0) {
            rem = 0;
            clearInterval(timerInterval);
        }
        let aTimer = document.getElementById("adminTimer");
        let pTimer = document.getElementById("playerTimer");
        if (aTimer) aTimer.innerHTML = rem;
        if (pTimer) pTimer.innerHTML = rem;
    }, 200);
}

function stopLocalTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function hideAll(){
    document.getElementById("main").style.display="none";
    document.getElementById("adminPage").style.display="none";
    document.getElementById("teamPage").style.display="none";
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("gamePage").style.display="none";
    document.getElementById("scorePage").style.display="none";
}

function showAdmin(){
    hideAll();
    isSpectator = false;
    document.getElementById("adminPage").style.display="block";
    document.getElementById("spectatorCodeBox").style.display="none";
    document.getElementById("password").value = "";
}

document.getElementById("password").addEventListener("input", function(){
    if(this.value.trim().toUpperCase() === "MRS"){
        document.getElementById("spectatorCodeBox").style.display="block";
        isSpectator = true;
    } else {
        document.getElementById("spectatorCodeBox").style.display="none";
        isSpectator = false;
    }
});

function showTeam(){
    hideAll();
    isSpectator = false;
    document.getElementById("teamPage").style.display="block";
}

function loginAdmin(){
    let pass = document.getElementById("password").value.trim();
    if(pass === "TMGRT"){
        hideAll();
        document.getElementById("adminPanel").style.display="block";
    } else if(pass.toUpperCase() === "MRS"){
        let code = document.getElementById("spectatorRoomCode").value.trim();
        if(code === ""){
            alert("Zəhmət olmasa izləniləcək otaq kodunu daxil edin!");
            return;
        }
        
        hideAll();
        document.getElementById("gamePage").style.display="block";
        document.getElementById("myTeam").innerHTML = "İzləyici Rejimi";
        document.getElementById("pressButtonElem").style.display = "none";
        document.getElementById("teamStatus").innerHTML = "Canlı izlənilir...";
        
        startSpectatorMode(code);
    } else {
        alert("Səhv şifrə");
    }
}

function startSpectatorMode(code){
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,onValue})=>{
            onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                let teams = snapshot.val() || {};
                let green = "-";
                let red = "-";
                for(let team in teams){
                    if(teams[team].table==="green") green = team;
                    if(teams[team].table==="red") red = team;
                }
                let g2 = document.getElementById("greenTeamPlayer");
                let r2 = document.getElementById("redTeamPlayer");
                if(g2) g2.innerHTML = "Yaşıl: " + green;
                if(r2) r2.innerHTML = "Qırmızı: " + red;
            });

            onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                let gPlayer = document.getElementById("greenScorePlayer");
                let rPlayer = document.getElementById("redScorePlayer");
                if(gPlayer) gPlayer.innerHTML = scores.green;
                if(rPlayer) rPlayer.innerHTML = scores.red;
            });

            onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                let tData = snapshot.val();
                if (tData && tData.status === "started") {
                    startLocalTimer(tData.startTime, tData.duration || 20);
                } else {
                    stopLocalTimer();
                    if (tData && tData.duration !== undefined) {
                        let pTimer = document.getElementById("playerTimer");
                        if (pTimer) pTimer.innerHTML = tData.duration;
                    }
                }
            });

            onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                let data = snapshot.val();
                let status = document.getElementById("teamStatus");
                if(data){
                    stopLocalTimer();
                    if(data.valid===false){
                        status.innerHTML="FAIL START: "+data.team;
                        status.style.color="#ef4444";
                    } else if(data.valid===true){
                        status.innerHTML="Basdı: "+data.team;
                        status.style.color="#22c55e";
                    }
                } else {
                    status.innerHTML="Canlı izlənilir...";
                    status.style.color="#94a3b8";
                }
            });

            onValue(ref(db,"rooms/"+code+"/globalWinner"),(snapshot)=>{
                let winnerColor = snapshot.val();
                let overlay = document.getElementById("winnerOverlay");
                let msg = document.getElementById("winnerMessage");
                if(winnerColor){
                    overlay.style.display = "flex";
                    msg.innerHTML = "OYUN BİTDİ<br><span style='font-size:20px; color:#94a3b8'>" + (winnerColor === 'green' ? "Yaşıl Masa qalib oldu" : "Qırmızı Masa qalib oldu") + "</span>";
                } else {
                    overlay.style.display = "none";
                }
            });
        });
    });
}

function createRoom(){
    let code = Math.floor(1000 + Math.random()*9000);
    let rDisp = document.getElementById("roomDisplay");
    rDisp.style.display = "inline-block";
    rDisp.innerHTML = "Otaq kodu: " + code;
    listenPress(code);
    
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set})=>{
            set(ref(db, "rooms/" + code), {
                active: true,
                created: Date.now(),
                scores: { green: 0, red: 0 }
            });
        });
    });
}

function listenPress(code){
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,onValue})=>{
            onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                let data = snapshot.val();
                let winElem = document.getElementById("winner");
                if(data){
                    stopLocalTimer();
                    if(data.valid === true){
                        winElem.innerHTML = data.team + " BASDI!";
                        winElem.style.color = "#22c55e";
                    }else{
                        winElem.innerHTML = data.team + " - FAIL START";
                        winElem.style.color = "#ef4444";
                    }
                }
            });

            onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                let teams = snapshot.val() || {};
                let green = "-";
                let red = "-";

                for(let team in teams){
                    if(teams[team].table==="green") green = team;
                    if(teams[team].table==="red") red = team;
                }

                let g = document.getElementById("greenTeam");
                let r = document.getElementById("redTeam");
                if(g) g.innerHTML = "Yaşıl: " + green;
                if(r) r.innerHTML = "Qırmızı: " + red;

                let g2 = document.getElementById("greenTeamPlayer");
                let r2 = document.getElementById("redTeamPlayer");
                if(g2) g2.innerHTML = "Yaşıl: " + green;
                if(r2) r2.innerHTML = "Qırmızı: " + red;

                let sGreen = document.getElementById("scoreGreenName");
                let sRed = document.getElementById("scoreRedName");
                if(sGreen) sGreen.innerHTML = "Yaşıl: " + green;
                if(sRed) sRed.innerHTML = "Qırmızı: " + red;
            });

            onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                let gScore = document.getElementById("greenScore");
                let rScore = document.getElementById("redScore");
                if(gScore) gScore.innerHTML = scores.green;
                if(rScore) rScore.innerHTML = scores.red;
                
                let gPlayer = document.getElementById("greenScorePlayer");
                let rPlayer = document.getElementById("redScorePlayer");
                if(gPlayer) gPlayer.innerHTML = scores.green;
                if(rPlayer) rPlayer.innerHTML = scores.red;
            });

            onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                let tData = snapshot.val();
                if (tData && tData.status === "started") {
                    startLocalTimer(tData.startTime, tData.duration || 20);
                } else {
                    stopLocalTimer();
                    if (tData && tData.duration !== undefined) {
                        let aTimer = document.getElementById("adminTimer");
                        let pTimer = document.getElementById("playerTimer");
                        if (aTimer) aTimer.innerHTML = tData.duration;
                        if (pTimer) pTimer.innerHTML = tData.duration;
                    }
                }
            });
        });
    });
}

function joinRoom(){
    let name = document.getElementById("teamName").value.trim();
    let code = document.getElementById("roomCode").value.trim();
    let color = document.getElementById("teamColor").value;

    if(name==="" || code===""){
        alert("Ad və otaq kodunu daxil edin");
        return;
    }

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set,onValue})=>{
            get(ref(db,"rooms/"+code)).then((snapshot)=>{
                if(snapshot.exists()){
                    get(ref(db,"rooms/"+code+"/teams")).then((teamSnapshot)=>{
                        let teams = teamSnapshot.val() || {};
                        for(let team in teams){
                            if(teams[team].table === color){
                                alert("Bu masa artıq tutulub!");
                                return;
                            }
                        }

                        document.getElementById("teamPage").style.display="none";
                        document.getElementById("gamePage").style.display="block";
                        document.getElementById("pressButtonElem").style.display = "inline-block";

                        set(ref(db,"rooms/"+code+"/teams/"+name),{ table:color });
                        document.getElementById("myTeam").innerHTML = name;

                        let playButton = document.querySelector("#gamePage button.press-btn");
                        if(color==="green"){
                            playButton.classList.add("green-buzzer");
                        }

                        let status = document.getElementById("teamStatus");
                        
                        onValue(ref(db,"rooms/"+code+"/teams"),(snapshot)=>{
                            let teams = snapshot.val() || {};
                            let green = "-";
                            let red = "-";
                            for(let team in teams){
                                if(teams[team].table==="green") green = team;
                                if(teams[team].table==="red") red = team;
                            }
                            let g1 = document.getElementById("greenTeam");
                            let r1 = document.getElementById("redTeam");
                            if(g1) g1.innerHTML = "Yaşıl: " + green;
                            if(r1) r1.innerHTML = "Qırmızı: " + red;

                            let g2 = document.getElementById("greenTeamPlayer");
                            let r2 = document.getElementById("redTeamPlayer");
                            if(g2) g2.innerHTML = "Yaşıl: " + green;
                            if(r2) r2.innerHTML = "Qırmızı: " + red;
                        });

                        onValue(ref(db,"rooms/"+code+"/scores"),(snapshot)=>{
                            let scores = snapshot.val() || { green:0, red:0 };
                            let gPlayer = document.getElementById("greenScorePlayer");
                            let rPlayer = document.getElementById("redScorePlayer");
                            if(gPlayer) gPlayer.innerHTML = scores.green;
                            if(rPlayer) rPlayer.innerHTML = scores.red;
                        });

                        onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                            let tData = snapshot.val();
                            if (tData && tData.status === "started") {
                                startLocalTimer(tData.startTime, tData.duration || 20);
                            } else {
                                stopLocalTimer();
                                if (tData && tData.duration !== undefined) {
                                    let aTimer = document.getElementById("adminTimer");
                                    let pTimer = document.getElementById("playerTimer");
                                    if (aTimer) aTimer.innerHTML = tData.duration;
                                    if (pTimer) pTimer.innerHTML = tData.duration;
                                }
                            }
                        });

                        onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{
                            let data = snapshot.val();
                            let button = document.querySelector("#gamePage button.press-btn");
                            if(data){
                                stopLocalTimer();
                                if(button){
                                    button.disabled = true;
                                }
                                if(data.valid===false){
                                    if(data.team===name){
                                        status.innerHTML="FAIL START";
                                        status.style.color="#ef4444";
                                    } else {
                                        status.innerHTML="Rəqib fail start etdi";
                                        status.style.color="#f59e0b";
                                    }
                                } else if(data.valid===true){
                                    if(data.team===name){
                                        status.innerHTML="Siz ilk basdınız!";
                                        status.style.color="#22c55e";
                                    } else {
                                        status.innerHTML="Rəqib basdı: " + data.team;
                                        status.style.color="#ef4444";
                                    }
                                }
                            }
                        });

                        onValue(ref(db,"rooms/"+code+"/resetSignal"),(snapshot)=>{
                            let signal = snapshot.val();
                            if(!signal) return;
                            let button = document.querySelector("#gamePage button.press-btn");
                            if(button){
                                if(signal.type === "reset"){
                                    button.disabled = false;
                                    button.innerHTML = "BAS";
                                    if(status) { status.innerHTML = ""; }
                                } else if(signal.type === "next"){
                                    // Əgər bu komanda fail start etmişdisə, blokda qalmağa davam edir
                                    if(signal.failTeam === name){
                                        button.disabled = true;
                                        button.innerHTML = "BLOK";
                                        if(status) { status.innerHTML = "Fail start etdiyiniz üçün bu tur blokdarsınız!"; status.style.color="#ef4444"; }
                                    } else if(signal.blockedTeam === name){
                                        button.disabled = true;
                                        button.innerHTML = "🔒";
                                        if(status) { status.innerHTML = "Şansınızı itirdiniz"; status.style.color="#ef4444"; }
                                    } else {
                                        button.disabled = false;
                                        button.innerHTML = "BAS";
                                        if(status) { status.innerHTML = ""; }
                                    }
                                }
                            }
                        });
                        
                        onValue(ref(db,"rooms/"+code+"/globalWinner"),(snapshot)=>{
                            let winnerColor = snapshot.val();
                            let overlay = document.getElementById("winnerOverlay");
                            let msg = document.getElementById("winnerMessage");
                            
                            if(winnerColor){
                                overlay.style.display = "flex";
                                if(winnerColor === color){
                                    msg.innerHTML = "TƏBRİKLƏR!<br><span style='font-size:20px; color:#22c55e'>SİZ QALİB OLDUNUZ</span>";
                                } else {
                                    msg.innerHTML = "OYUN BİTDİ<br><span style='font-size:20px; color:#64748b'>Rəqib komanda qalib gəldi</span>";
                                }
                            } else {
                                overlay.style.display = "none";
                            }
                        });
                    });
                } else {
                    alert("Belə otaq mövcud deyil");
                }
            });
        });
    });
}

function startGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            remove(ref(db, "rooms/" + code + "/pressed"));
            set(ref(db,"rooms/"+code+"/gameStarted"),true).then(()=>{
                set(ref(db, "rooms/" + code + "/timer"), { startTime: Date.now(), duration: 20, status: "started" });
                set(ref(db,"rooms/"+code+"/resetSignal"),{ type: "reset", time: Date.now() });
            });
        });
    });
}

function continueGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set,remove})=>{
            get(ref(db, "rooms/" + code + "/pressed")).then((pSnap) => {
                let pressedData = pSnap.val();
                if(!pressedData || !pressedData.team) {
                    alert("NEXT yalnız kimsə basdıqdan sonra işləyir!");
                    return;
                }

                get(ref(db, "rooms/" + code + "/timer")).then((tSnap) => {
                    let tData = tSnap.val() || { duration: 20 };
                    let rem = tData.duration !== undefined ? tData.duration : 20;

                    let signalPayload = { type: "next", time: Date.now() };
                    
                    // Əgər basan komanda FAIL START edibsə, onu xüsusi olaraq failTeam kimi qeyd edirik ki, blokda qalsın
                    if(pressedData.valid === false) {
                        signalPayload.failTeam = pressedData.team;
                    } else {
                        signalPayload.blockedTeam = pressedData.team;
                    }

                    remove(ref(db, "rooms/" + code + "/pressed"));
                    set(ref(db, "rooms/" + code + "/resetSignal"), signalPayload);
                    set(ref(db, "rooms/" + code + "/gameStarted"), true);
                    set(ref(db, "rooms/" + code + "/timer"), { status: "started", startTime: Date.now(), duration: rem });
                    
                    let winner = document.getElementById("winner");
                    if(winner) winner.innerHTML = "";
                });
            });
        });
    });
}

function resetGame(){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            set(ref(db,"rooms/"+code+"/gameStarted"),false);
            remove(ref(db,"rooms/"+code+"/pressed"));
            set(ref(db, "rooms/" + code + "/timer"), { status: "stopped", duration: 20 });
            
            document.getElementById("adminTimer").innerHTML = "20";
            let pT = document.getElementById("playerTimer");
            if (pT) pT.innerHTML = "20";

            set(ref(db,"rooms/"+code+"/resetSignal"),{ type: "reset", time: Date.now() });

            let winner = document.getElementById("winner");
            if(winner) winner.innerHTML="";
        });
    });
}

function pressButton(){
    if(isSpectator) return;
    let name = document.getElementById("teamName").value.trim();
    let code = document.getElementById("roomCode").value.trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,runTransaction,update})=>{
            get(ref(db,"rooms/"+code+"/gameStarted")).then((snapshot)=>{
                let started = snapshot.val() === true;

                runTransaction(ref(db,"rooms/"+code+"/pressed"),(current)=>{
                    if(current !== null) return current;
                    return { team:name, valid:started, time:Date.now() };
                }).then((result)=>{
                    if(result.committed){
                        get(ref(db, "rooms/" + code + "/timer")).then((tSnap) => {
                            let tData = tSnap.val() || { startTime: Date.now(), duration: 20 };
                            let rem = tData.duration || 20;
                            if(started && tData.startTime){
                                let passed = Math.floor((Date.now() - tData.startTime) / 1000);
                                rem = rem - passed;
                            }
                            if (rem < 0) rem = 0;
                            
                            update(ref(db, "rooms/" + code + "/timer"), { status: "stopped", duration: rem });
                        });

                        if(started){
                            document.getElementById("teamStatus").innerHTML = "Siz ilk basdınız!";
                            document.getElementById("teamStatus").style.color = "#22c55e";
                        } else {
                            document.getElementById("teamStatus").innerHTML = "FAIL START";
                            document.getElementById("teamStatus").style.color = "#ef4444";
                        }
                    } else {
                        document.getElementById("teamStatus").innerHTML = "Rəqib daha tez basdı";
                        document.getElementById("teamStatus").style.color = "#ef4444";
                    }
                });
            });
        });
    });
}

function changeScore(color, amount){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,get,set})=>{
            get(ref(db,"rooms/"+code+"/scores")).then((snapshot)=>{
                let scores = snapshot.val() || { green:0, red:0 };
                scores[color] += amount;
                if(scores[color] < 0) scores[color] = 0;
                set(ref(db,"rooms/"+code+"/scores"),scores);
            });
        });
    });
}

function declareWinner(color){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();
    if(!confirm("Bu komanda yekun qalib elan olunacaq. Əminsiniz?")) return;
    
    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set})=>{
            set(ref(db,"rooms/"+code+"/globalWinner"), color);
        });
    });
}

function resetScores(){
    let code = document.getElementById("roomDisplay").innerText.replace("Otaq kodu: ","").trim();
    if(!confirm("Xalları sıfırlamaq istəyirsiniz?")) return;

    import("./firebase.js").then((module)=>{
        let db = module.db;
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        .then(({ref,set,remove})=>{
            set(ref(db,"rooms/"+code+"/scores"),{ green:0, red:0 });
            remove(ref(db,"rooms/"+code+"/globalWinner"));
        });
    });
}

function showScores(){
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("scorePage").style.display="block";
}

function backToAdmin(){
    document.getElementById("scorePage").style.display="none";
    document.getElementById("adminPanel").style.display="block";
}

function goHome(){
    hideAll();
    document.getElementById("main").style.display="block";
}
</script>

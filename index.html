
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brain Ring</title>

<style>
body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#111827;
    color:white;
    text-align:center;
}

.box {
    padding:25px;
}

button {
    width:90%;
    max-width:400px;
    padding:20px;
    margin:10px;
    border:0;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
}

.admin {
    background:#22c55e;
}

.team {
    background:#2563eb;
}

input {
    width:80%;
    max-width:350px;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.hidden {
    display:none;
}

#status {
    margin-top:25px;
    font-size:24px;
}

</style>
</head>


<body>

<div class="box">


<div id="main">

<h1>🧠 Brain Ring</h1>

<button class="admin" onclick="showAdmin()">
👑 Aparıcı
</button>

<br>

<button class="team" onclick="showTeam()">
👥 Komanda
</button>

</div>



<div id="adminPage" class="hidden">

<h2>👑 Admin giriş</h2>

<input id="password" type="password" placeholder="Şifrə">

<br>

<button class="admin" onclick="loginAdmin()">
DAXİL OL
</button>

</div>




<div id="teamPage" class="hidden">

<h2>👥 Komanda</h2>

<input id="teamName" placeholder="Komanda adı">

<br>

<input id="roomCode" placeholder="Otaq kodu">

<br>

<button class="team" onclick="joinRoom()">
QOŞUL
</button>

</div>



<div id="adminPanel" class="hidden">

<h2>👑 Admin panel</h2>

<button class="admin" onclick="createRoom()">
OTAQ YARAT
</button>

<h3 id="roomDisplay"></h3>

<br>

<button class="admin">
START
</button>

<button class="team">
RESET
</button>

</div>

<div id="status"></div>


</div>



<script>

function hideAll(){

document.getElementById("main").style.display="none";
document.getElementById("adminPage").style.display="none";
document.getElementById("teamPage").style.display="none";
document.getElementById("adminPanel").style.display="none";

}



function showAdmin(){

hideAll();

document.getElementById("adminPage").style.display="block";

}



function showTeam(){

hideAll();

document.getElementById("teamPage").style.display="block";

}



function loginAdmin(){

let pass=document.getElementById("password").value;


if(pass==="TMGRT"){

hideAll();

document.getElementById("adminPanel").style.display="block";

}

else{

alert("Səhv şifrə");

}

}
function createRoom(){

let code = Math.floor(100000 + Math.random()*900000);

document.getElementById("roomDisplay").innerHTML =
"🏠 Otaq kodu: " + code;


import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set})=>{

set(ref(db, "rooms/" + code), {
active:true,
created:Date.now()
});

});

});

}
function joinRoom(){

let name = document.getElementById("teamName").value;
let code = document.getElementById("roomCode").value;


if(name==="" || code===""){
    alert("Ad və otaq kodunu yaz");
    return;
}


import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get})=>{


get(ref(db,"rooms/"+code))
.then((snapshot)=>{


if(snapshot.exists()){

alert("Qoşuldun: " + name);

}
else{

alert("Belə otaq yoxdur");

}


});


});

});

}
</script>


</body>
</html>

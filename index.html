<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Ring</title>
<style>
body {
    margin:0;
    font-family:"Arial", sans-serif;
    background: radial-gradient(circle at top,#1e1b4b,#030712 80%);
    color:white;
    text-align:center;
    min-height:100vh;
    padding-top: 40px;
}
.box {
    padding:25px;
    max-width:500px;
    margin:auto;
    background: rgba(30, 41, 59, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}
h1 {
    font-size:48px;
    margin:25px 0 35px 0;
    background:linear-gradient(90deg,#38bdf8,#818cf8,#f472b6);
    -webkit-background-clip:text;
    color:transparent;
    letter-spacing:2px;
}
h2 { font-size:28px; margin:25px; color: #cbd5e1; }
h3 { font-size:24px; color:#facc15; }
button {
    width:90%;
    max-width:420px;
    padding:18px;
    margin:12px auto;
    border:none;
    border-radius:20px;
    font-size:22px;
    font-weight:800;
    color:white;
    cursor:pointer;
    transition:0.25s;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
    display: block;
}
button:hover { transform:translateY(-2px); filter: brightness(1.1); }
button:active { transform:scale(.96); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; filter: grayscale(1); }
.admin { background: linear-gradient(135deg,#10b981,#059669); }
.team { background: linear-gradient(135deg,#3b82f6,#2563eb); }
.soundBtn, .backBtn { background: linear-gradient(135deg,#475569,#334155) !important; color:white !important; }
input, select {
    width:80%;
    max-width:380px;
    padding:16px;
    margin:12px auto;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius:16px;
    background: rgba(15, 23, 42, 0.6);
    color: white;
    font-size:18px;
    text-align:center;
    outline:none;
}
input:focus, select:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
select option { background: #0f172a; color: white; }
.hidden { display:none !important; }
#roomDisplay {
    display:inline-block;
    padding:12px 24px;
    border-radius:16px;
    background:#0f172a;
    color:#facc15;
    font-size:32px;
    margin:20px;
    box-shadow: 0 0 25px rgba(250,204,21,.25);
    border: 1px solid rgba(250, 204, 21, 0.2);
}
#winner { font-size:30px; color:#38bdf8; margin:25px; animation:pulse 1s infinite; }
#teamStatus { font-size:26px; margin:25px; font-weight:bold; }
#gamePage button {
    width:210px;
    height:210px;
    border-radius:50%;
    font-size:42px;
    margin: 2px auto;
    background: radial-gradient(circle at 30% 25%, #f87171, #dc2626 50%, #7f1d1d);
    box-shadow: 0 0 40px rgba(239,68,68,.7), inset 0 0 25px rgba(255,255,255,.25);
}
#gamePage button:active { box-shadow: 0 0 10px rgba(239,68,68,.5); }
#scorePage button { width: 60px; display: inline-block; margin: 5px; padding: 12px; font-size: 18px; border-radius: 12px; }
#greenScore { color: #4ade80; font-size: 54px; }
#redScore { color: #f87171; font-size: 54px; }
@keyframes pulse { 0% { transform:scale(1); } 50% { transform:scale(1.04); } 100% { transform:scale(1); } }
.score-pop { animation: popUp 0.4s ease-out; display: inline-block; }
@keyframes popUp { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); margin: 20px 0; }
</style>
</head>
<body>
<div class="box">
    <div id="main">
        <h1>🧠 Brain Ring</h1>
        <button class="admin" onclick="showAdmin()">👑 Aparıcı</button>
        <br>
        <button class="team" onclick="showTeam()">👥 Komanda</button>
    </div>
    <div id="adminPage" class="hidden">
        <h2>👑 Admin giriş</h2>
        <input id="password" type="password" placeholder="Şifrə">
        <br>
        <button class="admin" onclick="loginAdmin()">DAXİL OL</button>
        <button class="backBtn" onclick="goHome()">⬅️ Geri</button>
    </div>
    <div id="teamPage" class="hidden">
        <h2>👥 Komanda</h2>
        <input id="teamName" placeholder="Komanda adı">
        <br>
        <input id="roomCode" placeholder="Otaq kodu">
        <br>
        <select id="teamColor">
            <option value="green">🟢 Yaşıl masa</option>
            <option value="red">🔴 Qırmızı masa</option>
        </select>
        <br>
        <button class="soundBtn" onclick="unlockSound()">🔊 SƏSİ YOXLA</button>
        <button class="team" onclick="joinRoom()">QOŞUL</button>
        <button class="backBtn" onclick="goHome()">⬅️ Geri</button>
    </div>
    <div id="gamePage" class="hidden">
        <h2 id="myTeam"></h2>
        <div id="teamsTablePlayer" style="margin:12px auto; max-width:320px; background:#0f172a; border-radius:12px; padding:10px; font-size:18px; font-weight:bold; line-height:1.6; box-shadow:0 0 15px rgba(255,255,255,.08);">
            <div id="greenTeamPlayer">🟢 Yaşıl: -</div>
            <div id="redTeamPlayer">🔴 Qırmızı: -</div>
        </div>
        <div id="scoreBoardPlayer" style="margin:15px auto; max-width:300px; background:#0f172a; border-radius:12px; padding:12px; font-size:22px; font-weight:bold; box-shadow:0 0 15px rgba(255,255,255,.08);">
            🟢 <span id="greenScorePlayer">0</span> &nbsp;&nbsp;:&nbsp;&nbsp; <span id="redScorePlayer">0</span> 🔴
        </div>
        <h1 id="playerTimer" style="font-size: 55px; color: #facc15; margin: 10px 0; font-weight: 900;">20</h1>
        <button class="team" id="mainPressBtn" onclick="pressButton()">🔴 BAS</button>
        <h2 id="teamStatus"></h2>
    </div>
    <div id="adminPanel" class="hidden">
        <h2>👑 Admin panel</h2>
        <button class="admin" onclick="createRoom()">OTAQ YARAT</button>
        <h3 id="roomDisplay"></h3>
        <div id="teamsTable" style="margin:12px auto; max-width:320px; background:#0f172a; border-radius:12px; padding:10px; font-size:18px; font-weight:bold; line-height:1.6; box-shadow:0 0 15px rgba(255,255,255,.08);">
            <div id="greenTeam">🟢 Yaşıl: -</div>
            <div id="redTeam">🔴 Qırmızı: -</div>
        </div>
        <h2 id="winner"></h2>
        <br>
        <h1 id="adminTimer" style="font-size: 55px; color: #facc15; margin: 10px 0; font-weight: 900;">20</h1>
        <button class="admin" onclick="startGame()">START</button>
        <button class="admin" onclick="continueGame()">NEXT</button>
        <button class="admin" onclick="resetGame()">RESET</button>
        <button class="admin" onclick="showScores()">🏆 XALLAR</button>
    </div>
    <div id="scorePage" class="hidden">
        <h2>🏆 Xallar</h2>
        <div style="margin:20px auto; max-width:350px; background:#0f172a; padding:20px; border-radius:15px;">
            <h3>🟢 Yaşıl Komanda</h3>
            <h2 id="greenScore">0</h2>
            <button class="team" onclick="changeScore('green',-1)">➖</button>
            <button class="team" onclick="changeScore('green',1)">➕</button>
            <hr style="margin:25px 0;">
            <h3>🔴 Qırmızı Komanda</h3>
            <h2 id="redScore">0</h2>
            <button class="admin" onclick="changeScore('red',-1)">➖</button>
            <button class="admin" onclick="changeScore('red',1)">➕</button>
            <br><br>
            <div style="margin-top: 15px;">
                <button class="admin" onclick="resetScores()" title="Xalları sıfırla">🗑️</button>
                <button class="backBtn" onclick="backToAdmin()" title="Geri">⬅️</button>
            </div>
        </div>
    </div>
    <div id="status"></div>
</div>

<audio id="startSound" preload="auto"><source src="Ding.mp3" type="audio/mpeg"></audio>
<audio id="resetSound" preload="auto"><source src="Gong.mp3" type="audio/mpeg"></audio>
<audio id="failSound" preload="auto"><source src="fail.mp3" type="audio/mpeg"></audio>
<audio id="pressSound" preload="auto"><source src="press.mp3" type="audio/mpeg"></audio>

<script type="module">
import { db } from "./firebase.js";
import { ref, set, get, remove, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

let timerInterval = null;

window.hideAll = function() {
    document.getElementById("main").classList.add("hidden");
    document.getElementById("adminPage").classList.add("hidden");
    document.getElementById("teamPage").classList.add("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("gamePage").classList.add("hidden");
    document.getElementById("scorePage").classList.add("hidden");
}

window.showAdmin = function(){ hideAll(); document.getElementById("adminPage").classList.remove("hidden"); }
window.showTeam = function(){ hideAll(); document.getElementById("teamPage").classList.remove("hidden"); }
window.goHome = function(){ hideAll(); document.getElementById("main").classList.remove("hidden"); }
window.showScores = function(){ hideAll(); document.getElementById("scorePage").classList.remove("hidden"); }
window.backToAdmin = function(){ hideAll(); document.getElementById("adminPanel").classList.remove("hidden"); }

window.loginAdmin = function(){
    let pass = document.getElementById("password").value;
    if(pass === "TMGRT"){ hideAll(); document.getElementById("adminPanel").classList.remove("hidden"); } 
    else { alert("Səhv şifrə"); }
}

function startLocalCountdown(startTime) {
    if (timerInterval) clearInterval(timerInterval);
    let adminDisplay = document.getElementById("adminTimer");
    let playerDisplay = document.getElementById("playerTimer");
    timerInterval = setInterval(() => {
        let now = Date.now();
        let passed = Math.floor((now - startTime) / 1000);
        let timeLeft = 20 - passed;
        if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); }
        if (adminDisplay) adminDisplay.innerHTML = timeLeft;
        if (playerDisplay) playerDisplay.innerHTML = timeLeft;
    }, 200);
}

function stopLocalCountdown() {
    if (timerInterval) clearInterval(timerInterval);
    let adminDisplay = document.getElementById("adminTimer");
    let playerDisplay = document.getElementById("playerTimer");
    if (adminDisplay) adminDisplay.innerHTML = "20";
    if (playerDisplay) playerDisplay.innerHTML = "20";
}

window.createRoom = function(){
    let code = Math.floor(1000 + Math.random()*9000);
    document.getElementById("roomDisplay").innerHTML = "🏠 Otaq kodu: " + code;
    listenPress(code);
    set(ref(db, "rooms/" + code), { active: true, created: Date.now(), scores: { green: 0, red: 0 } });
}

function listenPress(code){
    onValue(ref(db, "rooms/" + code + "/pressed"), (snapshot) => {
        let data = snapshot.val();
        let winnerEl = document.getElementById("winner");
        if(data){
            if(data.valid === true){ winnerEl.innerHTML = "🔴 " + data.team + " BASDI!"; }
            else { winnerEl.innerHTML = "⚠️ " + data.team + " FAIL"; }
        } else {
            winnerEl.innerHTML = "";
        }
    });

    onValue(ref(db, "rooms/" + code + "/teams"), (snapshot) => {
        let teams = snapshot.val() || {};
        let green = "-"; let red = "-";
        for(let team in teams){
            if(teams[team].table === "green") green = team;
            if(teams[team].table === "red") red = team;
        }
        let g = document.getElementById("greenTeam"); 
        let r = document.getElementById("redTeam");
        if(g) g.innerHTML = "🟢 Yaşıl: " + green; 
        if(r) r.innerHTML = "🔴 Qırmızı: " + red;
    });

    onValue(ref(db, "rooms/" + code + "/scores"), (snapshot) => {
        let scores = snapshot.val() || { green:0, red:0 };
        let gScore = document.getElementById("greenScore"); 
        let rScore = document.getElementById("redScore");
        if(gScore) gScore.innerHTML = scores.green; 
        if(rScore) rScore.innerHTML = scores.red;
    });

    onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
        let timerData = snapshot.val();
        if (timerData && timerData.status === "started") { 
            startLocalCountdown(timerData.startTime); 
        } else { 
            stopLocalCountdown(); 
        }
    });

    let adminPressSound = document.getElementById("pressSound"); 
    let adminFailSound = document.getElementById("failSound");
    onValue(ref(db, "rooms/" + code + "/sound"), (snapshot) => {
        let sound = snapshot.val(); if (!sound) return;
        if (sound.type === "press" && adminPressSound) { adminPressSound.currentTime = 0; adminPressSound.play().catch(()=>{}); }
        if (sound.type === "fail" && adminFailSound) { adminFailSound.currentTime = 0; adminFailSound.play().catch(()=>{}); }
    });
}

window.joinRoom = function(){
    let name = document.getElementById("teamName").value.trim();
    let code = document.getElementById("roomCode").value.trim();
    let color = document.getElementById("teamColor").value;
    if(name === "" || code === ""){ alert("Ad və otaq kodunu yazın"); return; }

    get(ref(db, "rooms/" + code)).then((snapshot) => {
        if(snapshot.exists()){
            get(ref(db, "rooms/" + code + "/teams")).then((teamSnapshot) => {
                let teams = teamSnapshot.val() || {};
                for(let team in teams){ 
                    if(teams[team].table === color && team !== name){ 
                        alert("⚠️ Bu masa artıq tutulub!"); return; 
                    } 
                }
                
                hideAll(); 
                document.getElementById("gamePage").classList.remove("hidden");
                set(ref(db, "rooms/" + code + "/teams/" + name), { table: color });
                document.getElementById("myTeam").innerHTML = (color === "green" ? "🟢 " : "🔴 ") + name;
                
                let playButton = document.getElementById("mainPressBtn");
                if(color === "green" && playButton){
                    playButton.style.background = "radial-gradient(circle at 30% 25%, #4ade80, #16a34a 50%, #14532d)";
                    playButton.style.boxShadow = "0 0 40px rgba(34,197,94,.7), inset 0 0 25px rgba(255,255,255,.25)";
                }

                let status = document.getElementById("teamStatus");

                onValue(ref(db, "rooms/" + code + "/teams"), (snapshot) => {
                    let teams = snapshot.val() || {}; let green = "-"; let red = "-";
                    for(let team in teams){ 
                        if(teams[team].table === "green") green = team; 
                        if(teams[team].table === "red") red = team; 
                    }
                    let g2 = document.getElementById("greenTeamPlayer"); 
                    let r2 = document.getElementById("redTeamPlayer");
                    if(g2) g2.innerHTML = "🟢 Yaşıl: " + green; 
                    if(r2) r2.innerHTML = "🔴 Qırmızı: " + red;
                });

                onValue(ref(db, "rooms/" + code + "/scores"), (snapshot) => {
                    let scores = snapshot.val() || { green: 0, red: 0 };
                    let gPlayer = document.getElementById("greenScorePlayer"); 
                    let rPlayer = document.getElementById("redScorePlayer");
                    if(gPlayer) gPlayer.innerHTML = scores.green; 
                    if(rPlayer) rPlayer.innerHTML = scores.red;
                });

                onValue(ref(db, "rooms/" + code + "/timer"), (snapshot) => {
                    let timerData = snapshot.val();
                    if (timerData && timerData.status === "started") { 
                        startLocalCountdown(timerData.startTime); 
                    } else { 
                        stopLocalCountdown(); 
                    }
                });

                onValue(ref(db, "rooms/" + code + "/pressed"), (snapshot) => {
                    let data = snapshot.val(); 
                    let button = document.getElementById("mainPressBtn");
                    if(data){
                        if (timerInterval) clearInterval(timerInterval);
                        if(button){ button.disabled = true; button.innerHTML = "🔒"; }
                        if(data.valid === false){ 
                            status.innerHTML = (data.team === name) ? "❌ FAIL START" : "❌ " + data.team + " FAIL START etdi!"; 
                        } else if(data.valid === true){ 
                            status.innerHTML = (data.team === name) ? "✅ Siz ilk basdınız!" : "🔴 " + data.team + " artıq basdı!"; 
                        }
                    }
                });

                onValue(ref(db, "rooms/" + code + "/resetSignal"), (snapshot) => {
                    let sig = snapshot.val(); 
                    let button = document.getElementById("mainPressBtn");
                    if(sig === "clear") {
                        if(button){ button.disabled = false; button.innerHTML = "🔴 BAS"; } 
                        if(status) status.innerHTML = "";
                    } else if(sig) {
                        get(ref(db, "rooms/" + code + "/pressed")).then((pSnap) => {
                            let pData = pSnap.val();
                            if(pData && pData.team === name && pData.valid === false) {
                                if(button){ button.disabled = true; button.innerHTML = "🔒"; }
                            } else {
                                if(button){ button.disabled = false; button.innerHTML = "🔴 BAS"; } 
                                if(status) status.innerHTML = "";
                            }
                        });
                    }
                });

                let startSound = document.getElementById("startSound"); 
                let resetSound = document.getElementById("resetSound");
                let failSound = document.getElementById("failSound"); 
                let pressSound = document.getElementById("pressSound");

                onValue(ref(db, "rooms/" + code + "/sound"), (snapshot) => {
                    let sound = snapshot.val(); if(!sound) return;
                    if(sound.type === "start" && startSound){ startSound.currentTime = 0; startSound.play().catch(()=>{}); }
                    if(sound.type === "reset" && resetSound){ resetSound.currentTime = 0; resetSound.play().catch(()=>{}); }
                    if(sound.type === "fail" && failSound){ failSound.currentTime = 0; failSound.play().catch(()=>{}); }
                    if(sound.type === "press" && pressSound){ pressSound.currentTime = 0; pressSound.play().catch(()=>{}); }
                });
            });
        } else { alert("Belə otaq yoxdur!"); }
    });
}

window.startGame = function(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!code) return alert("Əvvəlcə otaq yaradın!");
    
    remove(ref(db, "rooms/" + code + "/pressed"));
    set(ref(db, "rooms/" + code + "/resetSignal"), "clear");
    set(ref(db, "rooms/" + code + "/gameStarted"), true);
    set(ref(db, "rooms/" + code + "/timer"), { startTime: Date.now(), status: "started" }).then(() => {
        set(ref(db, "rooms/" + code + "/sound"), { type: "start", time: Date.now() });
        let startSound = document.getElementById("startSound");
        if(startSound){ startSound.currentTime = 0; startSound.play().catch(()=>{}); }
    });
}

window.continueGame = function(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!code) return;
    
    get(ref(db, "rooms/" + code + "/timer")).then((snapshot) => {
        let timerData = snapshot.val() || { startTime: Date.now() };
        let now = Date.now(); 
        let passed = now - timerData.startTime;
        
        remove(ref(db, "rooms/" + code + "/pressed"));
        set(ref(db, "rooms/" + code + "/resetSignal"), Date.now()); 
        set(ref(db, "rooms/" + code + "/timer"), { status: "started", startTime: Date.now() - passed });
    });
}

window.resetGame = function(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!code) return;
    
    set(ref(db, "rooms/" + code + "/gameStarted"), false); 
    remove(ref(db, "rooms/" + code + "/pressed"));
    set(ref(db, "rooms/" + code + "/timer"), { status: "stopped", startTime: 0 });
    set(ref(db, "rooms/" + code + "/resetSignal"), "clear"); 
    set(ref(db, "rooms/" + code + "/sound"), { type: "reset", time: Date.now() });
    
    let resetSound = document.getElementById("resetSound");
    if(resetSound){ resetSound.currentTime = 0; resetSound.play().catch(()=>{}); }
    let winner = document.getElementById("winner"); if(winner) winner.innerHTML = "";
}

window.pressButton = function(){
    let name = document.getElementById("teamName").value.trim();
    let code = document.getElementById("roomCode").value.trim();
    
    get(ref(db, "rooms/" + code + "/gameStarted")).then((snapshot) => {
        let started = snapshot.val() === true;
        runTransaction(ref(db, "rooms/" + code + "/pressed"), (current) => {
            if(current !== null){ return current; }
            return { team: name, valid: started, time: Date.now() };
        }).then((result) => {
            if(result.committed){
                if(started){
                    document.getElementById("teamStatus").innerHTML = "✅ Siz ilk basdınız!"; 
                    set(ref(db, "rooms/" + code + "/sound"), { type: "press", time: Date.now() });
                    let pressSound = document.getElementById("pressSound"); 
                    if(pressSound) { pressSound.currentTime = 0; pressSound.play().catch(()=>{}); }
                } else {
                    document.getElementById("teamStatus").innerHTML = "❌ FAIL START"; 
                    set(ref(db, "rooms/" + code + "/sound"), { type: "fail", time: Date.now() });
                    let failSound = document.getElementById("failSound"); 
                    if(failSound) { failSound.currentTime = 0; failSound.play().catch(()=>{}); }
                }
            } else { 
                document.getElementById("teamStatus").innerHTML = "⛔ Başqa komanda cavab verdi."; 
            }
        });
    });
}

window.changeScore = function(color, amount){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!code) return;
    
    get(ref(db, "rooms/" + code + "/scores")).then((snapshot) => {
        let scores = snapshot.val() || { green: 0, red: 0 };
        scores[color] += amount; 
        if(scores[color] < 0) scores[color] = 0;
        if(scores.green > 5) scores.green = 5; 
        if(scores.red > 5) scores.red = 5;
        set(ref(db, "rooms/" + code + "/scores"), scores);
    });
}

window.resetScores = function(){
    let code = document.getElementById("roomDisplay").innerText.replace("🏠 Otaq kodu: ","").trim();
    if(!code) return;
    
    set(ref(db, "rooms/" + code + "/scores"), { green: 0, red: 0 });
}

window.unlockSound = function(){
    let sound = document.getElementById("startSound");
    if(sound){
        sound.currentTime = 0;
        sound.play().then(() => { 
            sound.pause(); 
            sound.currentTime = 0; 
            alert("Səs aktiv edildi ✅"); 
        }).catch(() => { 
            alert("Səs aktiv olmadı ❌ (Lütfən brauzer icazələrini yoxlayın)"); 
        });
    }
}

document.getElementById("main").classList.remove("hidden");
</script>
</body>
</html>

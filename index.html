
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brain Ring</title>

<style>
body {
    margin:0;
    font-family:"Arial", sans-serif;
    background:
    radial-gradient(circle at top,#334155,#020617 70%);
    color:white;
    text-align:center;
    min-height:100vh;
}


.box {
    padding:25px;
    max-width:600px;
    margin:auto;
}


/* Başlıqlar */

h1 {

    font-size:55px;
    margin:35px 0;

    background:linear-gradient(90deg,#38bdf8,#818cf8,#f472b6);
    -webkit-background-clip:text;
    color:transparent;

    letter-spacing:2px;

}


h2 {

    font-size:32px;
    margin:25px;

}


h3 {

    font-size:28px;
    color:#facc15;

}


/* Düymələr */

button {

    width:90%;
    max-width:420px;

    padding:22px;

    margin:15px;

    border:none;

    border-radius:25px;

    font-size:25px;

    font-weight:800;

    color:white;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 12px 30px rgba(0,0,0,.45);

}


button:hover {

    transform:translateY(-3px);

}


button:active {

    transform:scale(.94);

}


/* Admin düyməsi */

.admin {

    background:
    linear-gradient(135deg,#22c55e,#15803d);

}


/* Komanda düyməsi */

.team {

    background:
    linear-gradient(135deg,#2563eb,#1e40af);

}


/* Inputlar */

input {

    width:80%;
    max-width:380px;

    padding:18px;

    margin:12px;

    border:none;

    border-radius:18px;

    background:#f8fafc;

    color:#111827;

    font-size:20px;

    text-align:center;

    outline:none;

}


/* Gizli hissə */

.hidden {

    display:none;

}


/* Otaq kodu */

#roomDisplay {

    display:inline-block;

    padding:15px 25px;

    border-radius:20px;

    background:#0f172a;

    color:#facc15;

    font-size:35px;

    margin:20px;

    box-shadow:
    0 0 25px rgba(250,204,21,.25);

}


/* Qalib yazısı */

#winner {

    font-size:35px;

    color:#38bdf8;

    margin:25px;

    animation:pulse 1s infinite;

}


/* Status */

#teamStatus {

    font-size:30px;

    margin:25px;

    font-weight:bold;

}


/* BAS düyməsi */

#gamePage button {

    width:230px;

    height:230px;

    border-radius:50%;

    font-size:45px;

    background:

    radial-gradient(circle at 30% 25%,
    #f87171,
    #dc2626 50%,
    #7f1d1d);

    box-shadow:

    0 0 40px rgba(239,68,68,.7),

    inset 0 0 25px rgba(255,255,255,.25);

}


#gamePage button:active {

    box-shadow:

    0 0 10px rgba(239,68,68,.5);

}



/* Animasiya */

@keyframes pulse {

0% {
    transform:scale(1);
}

50% {
    transform:scale(1.05);
}

100% {
    transform:scale(1);
}

}
#teamBoard{

margin-top:20px;
padding:15px;
background:white;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);

}



</style>
</head>


<body>

<div class="box">


<div id="main">

<h1>🧠 Brain Ring</h1>

<button class="admin" onclick="showAdmin()">
👑 Aparıcı
</button>

<br>

<button class="team" onclick="showTeam()">
👥 Komanda
</button>

</div>



<div id="adminPage" class="hidden">

<h2>👑 Admin giriş</h2>

<input id="password" type="password" placeholder="Şifrə">

<br>

<button class="admin" onclick="loginAdmin()">
DAXİL OL
</button>

</div>




<div id="teamPage" class="hidden">

<h2>👥 Komanda</h2>

<input id="teamName" placeholder="Komanda adı">

<br>

<input id="roomCode" placeholder="Otaq kodu">

<br>
<button onclick="unlockSound()">
🔊 SƏSİ YOXLA
</button>
<button class="team" onclick="joinRoom()">
QOŞUL
</button>

</div>
<div id="gamePage" class="hidden">

<h2 id="myTeam"></h2>

<button class="team" onclick="pressButton()" style="height:200px;font-size:40px;">
🔴 BAS
</button>
<h2 id="teamStatus"></h2>
</div>


<div id="adminPanel" class="hidden">

<h2>👑 Admin panel</h2>

<button class="admin" onclick="createRoom()">
OTAQ YARAT
</button>

<h3 id="roomDisplay"></h3>
<h2 id="winner"></h2>
<br>

<button class="admin" onclick="startGame()">
START
</button>
<h2 id="winner"></h2>
<button class="admin" onclick="resetGame()">
RESET
</button>

</div>

<div id="status"></div>


</div>



<script>

function hideAll(){

document.getElementById("main").style.display="none";
document.getElementById("adminPage").style.display="none";
document.getElementById("teamPage").style.display="none";
document.getElementById("adminPanel").style.display="none";

}



function showAdmin(){

hideAll();

document.getElementById("adminPage").style.display="block";

}



function showTeam(){

hideAll();

document.getElementById("teamPage").style.display="block";

}



function loginAdmin(){

let pass=document.getElementById("password").value;


if(pass==="TMGRT"){

hideAll();

document.getElementById("adminPanel").style.display="block";

}

else{

alert("Səhv şifrə");

}

}
function createRoom(){

let code = Math.floor(100000 + Math.random()*900000);

document.getElementById("roomDisplay").innerHTML =
"🏠 Otaq kodu: " + code;
listenPress(code);
import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set})=>{

set(ref(db, "rooms/" + code), {
active:true,
created:Date.now()
});

});

});

}
function listenPress(code){

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,onValue})=>{

onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{

let data = snapshot.val();

if(data){

if(data.valid === true){

document.getElementById("winner").innerHTML =
"🔴 " + data.team + " BASDI!";

}else{

document.getElementById("winner").innerHTML =
"⚠️ " + data.team + " FAIL";

}

}

});

});

});

}
function joinRoom(){

let name = document.getElementById("teamName").value;
let code = document.getElementById("roomCode").value;


if(name==="" || code===""){
alert("Ad və otaq kodunu yaz");
return;
}



import("./firebase.js").then((module)=>{

let db = module.db;


import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get,onValue})=>{


get(ref(db,"rooms/"+code))
.then((snapshot)=>{


if(snapshot.exists()){


document.getElementById("teamPage").style.display="none";

document.getElementById("gamePage").style.display="block";


document.getElementById("myTeam").innerHTML =
"🧠 "+name;



let status = document.getElementById("teamStatus");



// BAS NƏTİCƏSİ

onValue(ref(db,"rooms/"+code+"/pressed"),(snapshot)=>{


let data = snapshot.val();

let button = document.querySelector("#gamePage button");


if(data){


if(button){

button.disabled=true;
button.innerHTML="🔒";

}



if(data.team===name && data.valid===false){

status.innerHTML="❌ FAIL START";

}

else if(data.valid===true){

status.innerHTML=
"🔴 "+data.team+" artıq basdı!";

}


}

});




// RESET

onValue(ref(db,"rooms/"+code+"/resetSignal"),()=>{


let button = document.querySelector("#gamePage button");


if(button){

button.disabled=false;
button.innerHTML="🔴 BAS";

}


if(status){

status.innerHTML="";

}


});




// SƏS

let startSound=document.getElementById("startSound");
let resetSound=document.getElementById("resetSound");


onValue(ref(db,"rooms/"+code+"/sound"),(snapshot)=>{


let sound=snapshot.val();



if(sound==="start" && startSound){

startSound.currentTime=0;

startSound.play().catch(()=>{});

}



if(sound==="reset" && resetSound){

resetSound.currentTime=0;

resetSound.play().catch(()=>{});

}


});



}
else{

alert("Belə otaq yoxdur");

}


});


});


});

}
function startGame(){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();


import("./firebase.js").then((module)=>{

let db = module.db;


import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set})=>{


set(ref(db,"rooms/"+code+"/gameStarted"),true)
.then(()=>{


console.log("START göndərildi");


// iştirakçılar üçün səs siqnalı

set(ref(db,"rooms/"+code+"/sound"),"start");


// admin üçün səs

let startSound = document.getElementById("startSound");

if(startSound){

startSound.currentTime = 0;

startSound.play()
.catch(()=>{});

}


});


});


});


}
function resetGame(){

let code = document.getElementById("roomDisplay").innerText
.replace("🏠 Otaq kodu: ","")
.trim();


import("./firebase.js").then((module)=>{

let db = module.db;


import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,set,remove})=>{


// oyunu bağla

set(ref(db,"rooms/"+code+"/gameStarted"),false);


// əvvəlki basışı sil

remove(ref(db,"rooms/"+code+"/pressed"));


// iştirakçılara reset göndər

set(ref(db,"rooms/"+code+"/resetSignal"),Date.now());


// gong siqnalı

set(ref(db,"rooms/"+code+"/sound"),"reset");


// admin gong

let resetSound = document.getElementById("resetSound");

if(resetSound){

resetSound.currentTime = 0;

resetSound.play()
.catch(()=>{});

}



// admin qalib yazısını təmizlə

let winner = document.getElementById("winner");

if(winner){

winner.innerHTML="";

}


console.log("RESET göndərildi");


});


});


}
function pressButton(){

let name = document.getElementById("teamName").value;
let code = document.getElementById("roomCode").value;

import("./firebase.js").then((module)=>{

let db = module.db;

import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
.then(({ref,get,runTransaction})=>{

get(ref(db,"rooms/"+code+"/gameStarted"))
.then((snapshot)=>{

let started = snapshot.val() === true;

runTransaction(ref(db,"rooms/"+code+"/pressed"),(current)=>{

if(current !== null){
    return current;
}

return{

team:name,
valid:started,
time:Date.now()

};

}).then((result)=>{

if(result.committed){

if(started){

document.getElementById("teamStatus").innerHTML =
"✅ Siz ilk basdınız!";

}
else{

document.getElementById("teamStatus").innerHTML =
"❌ FAIL START";

}

}
else{

document.getElementById("teamStatus").innerHTML =
"⛔ Başqa komanda cavab verdi.";

}

});

});

});

});

}
function unlockSound(){

let sound = document.getElementById("startSound");

if(sound){

sound.currentTime = 0;

sound.play()
.then(()=>{

sound.pause();

sound.currentTime = 0;

alert("Səs aktiv edildi ✅");

})
.catch((error)=>{

console.log("Səs xətası:", error);

alert("Səs aktiv olmadı ❌");

});

}

}
</script>
<audio id="startSound" preload="auto">
    <source src="Ding.mp3" type="audio/mpeg">
</audio>

<audio id="resetSound" preload="auto">
    <source src="Gong.mp3" type="audio/mpeg">
</audio>



</body>
</html>
